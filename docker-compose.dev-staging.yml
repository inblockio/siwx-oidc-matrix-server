# Dev-staging docker-compose for the dev-aquafire box (207.154.209.103).
#
# Same services as the production docker-compose.yml (Synapse, Redis,
# siwx-oidc, Element Web, LiveKit, lk-jwt-service), pointed at the dev.*
# domains via .env.
#
# THE REVERSE PROXY IS NOT IN THIS FILE — ON PURPOSE.
# Caddy lives in its own compose project, docker-compose.caddy-proxy.yml
# (deployed to /home/dev/caddy-proxy/ on the box). It fronts eight vhosts
# across five independent compose projects; if it were a service HERE, a
# routine `docker compose -f docker-compose.dev-staging.yml down` would take
# the five unrelated legacy sites on the box down with it. That exact failure
# already happened once on this box under nginx-proxy — see the header of
# /home/dev/aquafier-rs/deployment/docker-compose-proxy.yml. Keep them split.
#
# How Caddy reaches these services: every service Caddy proxies joins the
# EXTERNAL `proxy_net` bridge network IN ADDITION to this project's default
# network. Compose registers the service name as a network alias on every
# network it joins, so `reverse_proxy matrix_synapse:8080` resolves from the
# caddy container regardless of the compose-generated container name.
# `redis` deliberately does NOT join proxy_net — Caddy never proxies it, so it
# stays confined to this project's default network.
#
# Differences from docker-compose.yml (production):
#   - `portal-net` (the prod shared-portal-Caddy network) is replaced by this
#     box's pre-existing `proxy_net`.
#   - Image tags/hosts/URLs are supplied via .env (see
#     .env.dev-staging.example), not hardcoded, matching how the prod
#     compose consumes env vars.
#
# Suggested `COMPOSE_PROJECT_NAME=matrix-staging` in .env, so this project's
# containers/volumes/network never collide with a `matrix` (production) or
# `matrix_e2e` project name if ever run on the same Docker daemon.
#
# Usage (see docs/2026-07-30-dev-staging-dev-aquafire.md for the full runbook):
#   cp .env.dev-staging.example .env
#   # ...generate secrets per the comments in .env, fill in dev.* hosts...
#   docker compose -f docker-compose.dev-staging.yml --env-file .env up -d

services:
  matrix_synapse:
    # SYNAPSE_IMAGE_REF / ELEMENT_IMAGE_REF (not a shared IMAGE_TAG — see
    # 2026-07-31 note below): full image refs including tag@digest, so each
    # image can be pinned to its OWN digest. Kept separate on purpose — a
    # single `IMAGE_TAG:${TAG}` applied to both `synapse:${TAG}` and
    # `element-web:${TAG}` cannot express two different digests for the same
    # tag string, and GHCR sha-tags have been observed to be republishable
    # (element-web:sha-4a3d434 drifted from the bytes originally deployed
    # under that tag), so tag-only pinning is not sufficient — see
    # .env.dev-staging.example and docs/2026-07-30-dev-staging-dev-aquafire.md.
    # Defaults track `:main` so a fresh checkout with no overrides still
    # starts (same fallback behavior the old shared IMAGE_TAG had).
    image: ${SYNAPSE_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc-matrix-server/synapse:main}
    restart: unless-stopped
    expose:
      - "${MATRIX_PORT}"
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_HOST}
      SYNAPSE_REPORT_STATS: ${MATRIX_REPORT_STATS}
      MATRIX_ADMIN_DID: ${MATRIX_ADMIN_DID:-}
      MAS_SHARED_SECRET: ${MAS_SHARED_SECRET}
    env_file:
      - .env
    depends_on:
      siwx-oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:${MATRIX_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - matrix_data:/data
    networks:
      - default
      - proxy_net

  redis:
    # REDIS_IMAGE_REF: same env-overridable digest-pin pattern as
    # SYNAPSE_IMAGE_REF/ELEMENT_IMAGE_REF above. The DEFAULT here is
    # production's current digest (conservative fallback for anyone standing
    # up a fresh checkout without an explicit override) — but THIS BOX does
    # NOT run that digest. dev-staging independently runs a NEWER redis
    # (8.10.0, digest 077ba791...) than prod (8.8.0, digest aa049e68...)
    # against its own AOF file, so /home/dev/matrix-staging/.env sets
    # REDIS_IMAGE_REF explicitly to dev's own digest — otherwise the default
    # below would downgrade this box's redis against a live AOF on the next
    # `up -d`. See docker-compose.yml for the prod-side rationale.
    image: ${REDIS_IMAGE_REF:-redis:latest@sha256:aa049e689e141a4358ad1d4562dc49c88a89fbab711fd8fcc33f684c80b26301}
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - redis_data:/data

  siwx-oidc:
    # Built by the separate siwx-oidc repo, so it is versioned independently of
    # this stack's IMAGE_TAG (which co-versions synapse + element-web). Pin via
    # SIWX_OIDC_TAG; defaults to main so a stack tag never demands a matching
    # siwx-oidc tag that does not exist.
    image: ghcr.io/inblockio/siwx-oidc:${SIWX_OIDC_TAG:-main}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SIWEOIDC_REDIS_URL: "redis://redis"
      SIWEOIDC_ADDRESS: 0.0.0.0
      SIWEOIDC_HOST: ${SIWEOIDC_HOST}
      SIWEOIDC_PORT: ${SIWEOIDC_PORT}
      SIWEOIDC_BASE_URL: ${SIWEOIDC_BASE_URL}
      SIWEOIDC_SIGNING_KEY_PEM: ${SIWEOIDC_SIGNING_KEY_PEM}
      SIWEOIDC_MAS_SHARED_SECRET: ${MAS_SHARED_SECRET}
      SIWEOIDC_SYNAPSE_ENDPOINT: http://matrix_synapse:${MATRIX_PORT}
      SIWEOIDC_REQUIRE_SECRET: "false"
      SIWEOIDC_SUPPORTED_DID_METHODS: '["pkh","key"]'
      SIWEOIDC_MATRIX_SERVER_NAME: ${MATRIX_HOST}
      RUST_LOG: ${RUST_LOG}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${SIWEOIDC_PORT}/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
      - proxy_net

  element-web:
    # See SYNAPSE_IMAGE_REF comment above — same split-var rationale.
    image: ${ELEMENT_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc-matrix-server/element-web:main}
    restart: unless-stopped
    environment:
      MATRIX_BASE_URL: ${MATRIX_BASE_URL}
      MATRIX_HOST: ${MATRIX_HOST}
      SIWEOIDC_BASE_URL: ${SIWEOIDC_BASE_URL}
    volumes:
      - ./config/element-config.json:/app/config.json.src:ro
      - ./entrypoints/element_entrypoint.sh:/docker-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      matrix_synapse:
        condition: service_healthy
    networks:
      - default
      - proxy_net

  livekit:
    # Pinned: an unpinned :latest jumps SFU versions on any `docker compose pull`,
    # which can change call behavior unannounced. Bump deliberately.
    image: livekit/livekit-server:v1.12.0
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_KEY}: ${LIVEKIT_SECRET}"
    ports:
      - "7881:7881/tcp"
      - "50100-50200:50100-50200/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    networks:
      - default
      - proxy_net

  lk-jwt-service:
    # LK_JWT_IMAGE_REF: same env-overridable digest-pin pattern as
    # REDIS_IMAGE_REF above. Prod and dev-staging were verified 2026-07-31 to
    # run the IDENTICAL digest here (unlike redis), so the same default is
    # safe for both boxes; set explicitly in dev's .env anyway for clarity/
    # symmetry with REDIS_IMAGE_REF, not because the default would diverge.
    image: ${LK_JWT_IMAGE_REF:-ghcr.io/element-hq/lk-jwt-service:latest@sha256:29918567e6b7cd920e2853b4cd6848ce01b79947c3d19a9f1ed5b74f0a2a88bf}
    restart: unless-stopped
    environment:
      LIVEKIT_URL: "wss://${MATRIX_HOST}/livekit/sfu"
      LIVEKIT_KEY: "${LIVEKIT_KEY}"
      LIVEKIT_SECRET: "${LIVEKIT_SECRET}"
      LIVEKIT_JWT_BIND: ":8080"
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: "${LIVEKIT_INSECURE_SKIP_VERIFY_TLS:-false}"
      # Required as of a recent lk-jwt-service release (was previously
      # optional/absent) — the container now refuses to start without it.
      # Found 2026-07-30 standing up dev-staging: `:latest` is unpinned and
      # had drifted to a version that hard-requires this var, restart-looping
      # with "LIVEKIT_FULL_ACCESS_HOMESERVERS environment variable must be
      # set". Grants full LiveKit room-creation access to our own homeserver
      # only (see element-hq/lk-jwt-service README security note). Upstreamed
      # to production's docker-compose.yml 2026-07-31 (matching prod's
      # server-local edit content-for-content) — no longer a gap there.
      LIVEKIT_FULL_ACCESS_HOMESERVERS: "${MATRIX_HOST}"
    depends_on:
      matrix_synapse:
        condition: service_healthy
    networks:
      - default
      - proxy_net

volumes:
  matrix_data:
  redis_data:

networks:
  # This project's own private network (redis + inter-service traffic).
  default: {}

  # VERIFIED 2026-07-30 (T3): `proxy_net` is the single pre-existing bridge
  # network shared by the reverse proxy and every backend on this box —
  #   aqua_proxy, aqua_acme, deployment-aqua-container-1, aqua-explorer,
  #   aquafier-rs, excalidraw
  # all sit on it (`docker network inspect proxy_net`). It is created and
  # owned by the standalone proxy compose project with an explicit `name:`,
  # so it is stable and app-agnostic. external:true means compose never
  # creates or removes it here.
  #
  # Trade-off, accepted deliberately: joining proxy_net makes these services
  # reachable from the legacy containers on the same bridge. That is the same
  # trust boundary the nginx-proxy pattern always required (every proxied
  # backend had to share this network), and the internet-facing surface is
  # unchanged — the edge deny for /_synapse/admin/* and /_synapse/mas/* lives
  # in Caddyfile.dev-aquafire and is unaffected.
  proxy_net:
    external: true
