# Dev-staging docker-compose for the dev-aquafire box (207.154.209.103).
#
# Same services as the production docker-compose.yml (Synapse, Redis,
# siwx-oidc, Element Web, LiveKit, lk-jwt-service), pointed at the dev.*
# domains via .env.
#
# THE REVERSE PROXY IS NOT IN THIS FILE — ON PURPOSE.
# Caddy lives in its own compose project, docker-compose.caddy-proxy.yml
# (deployed to /home/dev/caddy-proxy/ on the box). It fronts eight vhosts
# across five independent compose projects; if it were a service HERE, a
# routine `docker compose -f docker-compose.dev-staging.yml down` would take
# the five unrelated legacy sites on the box down with it. That exact failure
# already happened once on this box under nginx-proxy — see the header of
# /home/dev/aquafier-rs/deployment/docker-compose-proxy.yml. Keep them split.
#
# How Caddy reaches these services: every service Caddy proxies joins the
# EXTERNAL `proxy_net` bridge network IN ADDITION to this project's default
# network. Compose registers the service name as a network alias on every
# network it joins, so `reverse_proxy matrix_synapse:8080` resolves from the
# caddy container regardless of the compose-generated container name.
# `redis` deliberately does NOT join proxy_net — Caddy never proxies it, so it
# stays confined to this project's default network.
#
# Differences from docker-compose.yml (production):
#   - `portal-net` (the prod shared-portal-Caddy network) is replaced by this
#     box's pre-existing `proxy_net`.
#   - Image tags/hosts/URLs are supplied via .env (see
#     .env.dev-staging.example), not hardcoded, matching how the prod
#     compose consumes env vars.
#
# Suggested `COMPOSE_PROJECT_NAME=matrix-staging` in .env, so this project's
# containers/volumes/network never collide with a `matrix` (production) or
# `matrix_e2e` project name if ever run on the same Docker daemon.
#
# Usage (see docs/2026-07-30-dev-staging-dev-aquafire.md for the full runbook):
#   cp .env.dev-staging.example .env
#   # ...generate secrets per the comments in .env, fill in dev.* hosts...
#   docker compose -f docker-compose.dev-staging.yml --env-file .env up -d

services:
  matrix_synapse:
    # SYNAPSE_IMAGE_REF / ELEMENT_IMAGE_REF (not a shared IMAGE_TAG — see
    # 2026-07-31 note below): full image refs including tag@digest, so each
    # image can be pinned to its OWN digest. Kept separate on purpose — a
    # single `IMAGE_TAG:${TAG}` applied to both `synapse:${TAG}` and
    # `element-web:${TAG}` cannot express two different digests for the same
    # tag string, and GHCR sha-tags have been observed to be republishable
    # (element-web:sha-4a3d434 drifted from the bytes originally deployed
    # under that tag), so tag-only pinning is not sufficient — see
    # .env.dev-staging.example and docs/2026-07-30-dev-staging-dev-aquafire.md.
    # Defaults (2026-09-25) = the `:main` digests (rev 0a58e7e) that dev-staging
    # runs and that go to production, so a fresh checkout reproduces the tested
    # stack rather than whatever `:main` resolves to today. Synapse 1.161.0,
    # functionally identical to the branch build 4b830a74... (rev 0db1740) that
    # was tested first. Rollback on the box: 4b830a74... (same 1.161.0 content).
    #
    # THE BOX RUNS THIS FILE VERBATIM (since 2026-09-25) and its .env is the
    # single source of truth: every service's *_IMAGE_REF is set there to a
    # digest, so these defaults only matter for a fresh checkout. Deploys are
    # manual and digest-pinned (the matrix-staging-deploy.timer auto-pull is
    # RETIRED): edit one *_IMAGE_REF in .env, `up --dry-run`, then
    # `up -d --no-deps <svc>`. Remember .env is ALSO matrix_synapse's env_file,
    # so ANY .env edit recreates Synapse at its next `up`: plan it (see
    # docs/2026-07-30-dev-staging-dev-aquafire.md section 9).
    image: ${SYNAPSE_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc-matrix-server/synapse@sha256:2f1b6c17406c6031d16436287527524df7b095cfd2ea954f9fd4594fe959552a}
    restart: unless-stopped
    expose:
      - "${MATRIX_PORT}"
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_HOST}
      SYNAPSE_REPORT_STATS: ${MATRIX_REPORT_STATS}
      MATRIX_ADMIN_DID: ${MATRIX_ADMIN_DID:-}
      MAS_SHARED_SECRET: ${MAS_SHARED_SECRET}
    env_file:
      - .env
    depends_on:
      siwx-oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:${MATRIX_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - matrix_data:/data
    networks:
      - default
      - proxy_net

  redis:
    # REDIS_IMAGE_REF: same env-overridable digest-pin pattern as
    # SYNAPSE_IMAGE_REF/ELEMENT_IMAGE_REF above. Default (2026-09-25) = what
    # THIS BOX runs: redis 8.10.2 (Docker Official Image; index digest
    # cross-checked against docker-library/repo-info), set in the box's .env.
    # Production is upgraded 8.8.0 -> 8.10.2 in a deliberate, backed-up step
    # (runbook 2026-09-25-prod-promotion); 8.10 data files are one-way, so a
    # downgrade of either box against a live AOF is a data-loss risk.
    image: ${REDIS_IMAGE_REF:-redis:8.10.2@sha256:d5ac52db24d4e70566fe9944f22cf5bdc2bc739b05c0f426335161ea6c23f3b3}
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - redis_data:/data

  siwx-oidc:
    # Built by the separate siwx-oidc repo, so it is versioned independently of
    # synapse + element-web. SIWX_OIDC_IMAGE_REF is a FULL image ref (not a
    # bare tag, which the old SIWX_OIDC_TAG was) so that a digest-only
    # `ghcr.io/inblockio/siwx-oidc@sha256:…` pin is expressible — GHCR tags
    # have proven republishable and `:main`/`:dev` can resolve to different
    # bytes than the ones validated, so a tag name may misdescribe the image.
    # Defaults to :main so a fresh checkout with no overrides still starts.
    # The box pins it by digest in .env (no longer the floating :dev tag).
    image: ${SIWX_OIDC_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc:main}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SIWEOIDC_REDIS_URL: "redis://redis"
      SIWEOIDC_ADDRESS: 0.0.0.0
      SIWEOIDC_HOST: ${SIWEOIDC_HOST}
      SIWEOIDC_PORT: ${SIWEOIDC_PORT}
      SIWEOIDC_BASE_URL: ${SIWEOIDC_BASE_URL}
      SIWEOIDC_SIGNING_KEY_PEM: ${SIWEOIDC_SIGNING_KEY_PEM}
      SIWEOIDC_MAS_SHARED_SECRET: ${MAS_SHARED_SECRET}
      SIWEOIDC_SYNAPSE_ENDPOINT: http://matrix_synapse:${MATRIX_PORT}
      SIWEOIDC_REQUIRE_SECRET: "false"
      SIWEOIDC_SUPPORTED_DID_METHODS: '["pkh","key"]'
      SIWEOIDC_MATRIX_SERVER_NAME: ${MATRIX_HOST}
      # aqua-auth 0.7.0 shared credential store. EMPTY (the default) means the
      # legacy webauthn:credential/* namespace only, bit for bit what this box
      # did before -- siwx-oidc treats unset and blank identically as OFF.
      #
      # Note this service takes an explicit `environment:` map, NOT `env_file`,
      # so a variable added to .env alone never reaches the container. It has to
      # be listed here as well or the flag is silently inert: the operator sets
      # it, sees no error, and believes dual-write is on while nothing mirrors.
      #
      # Set to redis://redis to enable dual-write into aqua:webauthn:*. Run
      # `migrate-credentials --apply` first so the picker is complete from the
      # first request, and confirm the boot line reads "dual-write ENABLED" --
      # siwx-oidc refuses to start if this names a Redis it cannot open.
      AQUA_WEBAUTHN_REDIS_URL: ${AQUA_WEBAUTHN_REDIS_URL:-}
      RUST_LOG: ${RUST_LOG}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${SIWEOIDC_PORT}/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
      - proxy_net

  element-web:
    # See SYNAPSE_IMAGE_REF comment above — same split-var rationale.
    # Default (2026-09-25) = Element Web v1.12.29 `:main` build, rev 0a58e7e
    # (A+B+C+D-core+E browser EventIndex, same content as the branch build
    # 6f399c36... rev 0786800 tested first), the digest this box runs via .env.
    # Rollback: 6f399c36... (same 1.12.29 content), then 5fab1bcb... (1.12.26).
    image: ${ELEMENT_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc-matrix-server/element-web@sha256:8cea1873e57402701958100f79bff0f7f9672012c05c33bf1bf4c8972538c393}
    restart: unless-stopped
    environment:
      MATRIX_BASE_URL: ${MATRIX_BASE_URL}
      MATRIX_HOST: ${MATRIX_HOST}
      CLIENT_HOST: ${CLIENT_HOST}
      SIWEOIDC_BASE_URL: ${SIWEOIDC_BASE_URL}
    volumes:
      - ./config/element-config.json:/app/config.json.src:ro
      - ./entrypoints/element_entrypoint.sh:/docker-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      matrix_synapse:
        condition: service_healthy
    networks:
      - default
      - proxy_net

  livekit:
    # Pinned: an unpinned :latest jumps SFU versions on any `docker compose pull`,
    # which can change call behavior unannounced. Bump deliberately.
    # 2026-09-25: v1.13.7, tag@digest (Docker Hub index digest), the version
    # this box runs (LIVEKIT_IMAGE_REF in its .env, same digest).
    image: ${LIVEKIT_IMAGE_REF:-livekit/livekit-server:v1.13.7@sha256:6fd3b7088874c4d119160dd688798dfec852bc014786d392caad15f6f63912a3}
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_KEY}: ${LIVEKIT_SECRET}"
    ports:
      - "7881:7881/tcp"
      # Below the Linux ephemeral range (32768-60999). MUST match
      # rtc.port_range_start/end in config/livekit.dev-staging.yaml (kept in
      # sync with production's config/livekit.yaml — the rtc: block is
      # identical between the two, only turn: differs). `ufw allow
      # 20100:20200/udp` on this box before converging, or media dies silently
      # (T4, docs/superpowers/plans/2026-08-01-av-hardening-config.md).
      - "20100-20200:20100-20200/udp"
      # Embedded TURN (dev-staging only — see config/livekit.dev-staging.yaml
      # and docs/superpowers/plans/2026-08-03-turn-tls-edge-termination.md).
      # TURN-TLS (5349/tcp) is now edge-internal: caddy-l4 on this box
      # terminates TLS for turns:dev.turn.matrix.inblock.io:443 (SNI split)
      # and proxies the decrypted stream to this container over `proxy_net`
      # (`proxy tcp/livekit:5349` in Caddyfile.dev-aquafire), so 5349 is
      # DELIBERATELY NOT published here — publishing it would let a client
      # reach LiveKit's TURN port directly, bypassing the edge's TLS
      # termination entirely (external_tls mode expects a plaintext
      # connection only from the trusted edge). TURN-UDP (3478) has no such
      # intermediary and is still published + firewalled directly:
      # `ufw allow 3478/udp` on this box before converging. No ufw rule is
      # needed for 5349 now that it isn't host-published.
      - "3478:3478/udp"
    volumes:
      # Dev-staging mounts its OWN livekit config (turn: enabled), not the
      # production one — see config/livekit.dev-staging.yaml for why.
      - ./config/livekit.dev-staging.yaml:/etc/livekit.yaml:ro
      # No cert volume: external_tls: true means LiveKit never reads a
      # cert/key file — TLS termination happens at the edge (caddy-l4), not
      # here. The old ./config/livekit-tls:/etc/livekit-turn:ro mount (fed by
      # scripts/livekit-turn-cert-sync.sh) belonged to the superseded
      # in-process-TLS variant; that script/its systemd units stay in the
      # repo as tooling for the passthrough alternative but are unused by
      # this compose file now.
    healthcheck:
      # busybox wget (no curl in the image); GET / 406s until the node's first
      # stats tick (~8s from start, mostly the use_external_ip STUN lookup),
      # hence start_period. Mirrors docker-compose.yml.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7880/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default
      - proxy_net

  lk-jwt-service:
    # LK_JWT_IMAGE_REF: same env-overridable digest-pin pattern as
    # REDIS_IMAGE_REF above. Default (2026-09-25) = lk-jwt-service 0.7.0 (Rust
    # rewrite; GHCR index digest), the version this box runs via .env.
    # Rollback: 0.6.0@sha256:822f0c03...
    # AND restore `healthcheck: disable: true` below.
    # 0.7.0 behaviour change (#222): only LIVEKIT_FULL_ACCESS_HOMESERVERS users
    # and local users may publish; federated users get subscribe-only tokens.
    image: ${LK_JWT_IMAGE_REF:-ghcr.io/element-hq/lk-jwt-service:0.7.0@sha256:e0c7cecfa74e2342a3e79d47e1d4ab4bd228fe05b1a4dc4ba7f807686b0c214b}
    restart: unless-stopped
    environment:
      LIVEKIT_URL: "wss://${MATRIX_HOST}/livekit/sfu"
      LIVEKIT_KEY: "${LIVEKIT_KEY}"
      LIVEKIT_SECRET: "${LIVEKIT_SECRET}"
      LIVEKIT_JWT_BIND: ":8080"
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: "${LIVEKIT_INSECURE_SKIP_VERIFY_TLS:-false}"
      # Required as of a recent lk-jwt-service release (was previously
      # optional/absent) — the container now refuses to start without it.
      # Found 2026-07-30 standing up dev-staging: `:latest` is unpinned and
      # had drifted to a version that hard-requires this var, restart-looping
      # with "LIVEKIT_FULL_ACCESS_HOMESERVERS environment variable must be
      # set". Grants full LiveKit room-creation access to our own homeserver
      # only (see element-hq/lk-jwt-service README security note). Upstreamed
      # to production's docker-compose.yml 2026-07-31 (matching prod's
      # server-local edit content-for-content) — no longer a gap there.
      LIVEKIT_FULL_ACCESS_HOMESERVERS: "${MATRIX_HOST}"
    # Healthcheck RE-ENABLED 2026-09-25 for 0.7.0 (matches the box). History:
    # 0.6.0's image-level helper built "http://localhost:" + LIVEKIT_JWT_BIND,
    # so the canonical ":8080" gave "localhost::8080" and failed forever
    # (disabled 2026-08-30, else ci-deploy.sh's health gate wedged every
    # converge). Fixed upstream in 0.7.0 (#215): the Rust helper maps ":8080"
    # to [::]:8080 / 0.0.0.0:8080 and GETs /healthz. Verified against this
    # digest on 2026-09-25 (isolated probe container: helper exit 0, Docker
    # health=healthy). Declared explicitly rather than inherited so the cadence
    # does not depend on image metadata.
    healthcheck:
      test: ["CMD", "/lk-jwt-service-healthcheck"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      matrix_synapse:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks:
      - default
      - proxy_net

volumes:
  matrix_data:
  redis_data:

networks:
  # This project's own private network (redis + inter-service traffic).
  default: {}

  # VERIFIED 2026-07-30 (T3): `proxy_net` is the single pre-existing bridge
  # network shared by the reverse proxy and every backend on this box —
  #   aqua_proxy, aqua_acme, deployment-aqua-container-1, aqua-explorer,
  #   aquafier-rs, excalidraw
  # all sit on it (`docker network inspect proxy_net`). It is created and
  # owned by the standalone proxy compose project with an explicit `name:`,
  # so it is stable and app-agnostic. external:true means compose never
  # creates or removes it here.
  #
  # Trade-off, accepted deliberately: joining proxy_net makes these services
  # reachable from the legacy containers on the same bridge. That is the same
  # trust boundary the nginx-proxy pattern always required (every proxied
  # backend had to share this network), and the internet-facing surface is
  # unchanged — the edge deny for /_synapse/admin/* and /_synapse/mas/* lives
  # in Caddyfile.dev-aquafire and is unaffected.
  proxy_net:
    external: true
