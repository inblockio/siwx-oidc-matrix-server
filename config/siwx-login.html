<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>inblock.io Chat</title>
<style>
  body {
    margin: 0;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  .splash { text-align: center; }
  .splash img {
    width: 280px;
    max-width: 60vw;
    margin-bottom: 40px;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 24px;
  }
  .status {
    color: rgba(255,255,255,0.7);
    font-size: 15px;
    letter-spacing: 0.3px;
    margin: 0;
  }
  .error { color: #ff6b6b; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="splash">
  <img src="inblockio_logo_dark.png" alt="inblock.io">
  <div class="spinner" id="spinner"></div>
  <p class="status" id="status">Connecting your wallet...</p>
</div>
<script>
(function () {
  var HS_URL = "%%MATRIX_BASE_URL%%";
  var OIDC_BASE = "%%SIWEOIDC_BASE_URL%%";
  var statusEl = document.getElementById("status");
  var spinnerEl = document.getElementById("spinner");

  if (localStorage.getItem("mx_access_token") || localStorage.getItem("mx_has_access_token")) {
    window.location.replace("/");
    return;
  }

  function setError(msg) {
    statusEl.textContent = msg;
    statusEl.classList.add("error");
    spinnerEl.style.display = "none";
  }

  function generateCodeVerifier() {
    var array = new Uint8Array(32);
    crypto.getRandomValues(array);
    return btoa(String.fromCharCode.apply(null, array))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
  }

  async function sha256(plain) {
    var data = new TextEncoder().encode(plain);
    var hash = await crypto.subtle.digest("SHA-256", data);
    return btoa(String.fromCharCode.apply(null, new Uint8Array(hash)))
      .replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
  }

  var params = new URLSearchParams(window.location.search);

  if (params.has("code")) {
    handleCallback(params);
  } else {
    startOidc();
  }

  async function handleCallback(params) {
    statusEl.textContent = "Signing you in...";

    var code = params.get("code");
    var state = params.get("state");
    var storedState = sessionStorage.getItem("siwx_state");
    var codeVerifier = sessionStorage.getItem("siwx_code_verifier");
    var clientId = sessionStorage.getItem("siwx_client_id");

    if (!codeVerifier || !clientId || state !== storedState) {
      sessionStorage.clear();
      setError("Session expired. Restarting login...");
      setTimeout(function () { window.location.replace("/siwx-login.html"); }, 1500);
      return;
    }

    try {
      var tokenResp = await fetch(OIDC_BASE + "/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          grant_type: "authorization_code",
          code: code,
          redirect_uri: window.location.origin + "/",
          client_id: clientId,
          code_verifier: codeVerifier,
        }).toString(),
      });

      if (!tokenResp.ok) {
        var errBody = await tokenResp.text();
        console.error("Token error body:", errBody);
        throw new Error("Token exchange failed (" + tokenResp.status + "): " + errBody);
      }

      var tokenData = await tokenResp.json();
      if (!tokenData.access_token) {
        throw new Error("No access_token in response");
      }

      var whoamiResp = await fetch(HS_URL + "/_matrix/client/v3/account/whoami", {
        headers: { Authorization: "Bearer " + tokenData.access_token },
      });

      if (!whoamiResp.ok) {
        throw new Error("whoami failed (" + whoamiResp.status + ")");
      }

      var whoami = await whoamiResp.json();

      localStorage.setItem("mx_access_token", tokenData.access_token);
      localStorage.setItem("mx_user_id", whoami.user_id);
      localStorage.setItem("mx_device_id", whoami.device_id || "");
      localStorage.setItem("mx_hs_url", HS_URL);
      localStorage.setItem("mx_is_url", "");
      localStorage.setItem("mx_has_access_token", "true");

      sessionStorage.removeItem("siwx_code_verifier");
      sessionStorage.removeItem("siwx_state");
      sessionStorage.removeItem("siwx_client_id");
      sessionStorage.removeItem("siwx_hs_url");

      window.location.replace("/");
    } catch (e) {
      console.error("Callback failed:", e);
      setError("Sign-in failed: " + e.message);
    }
  }

  async function startOidc() {
    try {
      var codeVerifier = generateCodeVerifier();
      var codeChallenge = await sha256(codeVerifier);
      var state = generateCodeVerifier();

      sessionStorage.setItem("siwx_code_verifier", codeVerifier);
      sessionStorage.setItem("siwx_state", state);
      sessionStorage.setItem("siwx_hs_url", HS_URL);

      var clientId = sessionStorage.getItem("siwx_client_id");
      if (!clientId) {
        var regResp = await fetch(OIDC_BASE + "/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            client_name: "Element Web",
            redirect_uris: [window.location.origin + "/"],
            token_endpoint_auth_method: "none",
            response_types: ["code"],
            grant_types: ["authorization_code", "refresh_token"],
          }),
        });

        if (!regResp.ok) {
          throw new Error("Client registration failed (" + regResp.status + ")");
        }

        var regData = await regResp.json();
        clientId = regData.client_id;
        sessionStorage.setItem("siwx_client_id", clientId);
      }

      var authUrl = OIDC_BASE + "/authorize?" + new URLSearchParams({
        client_id: clientId,
        redirect_uri: window.location.origin + "/",
        response_type: "code",
        scope: "openid profile",
        state: state,
        code_challenge: codeChallenge,
        code_challenge_method: "S256",
      }).toString();

      window.location.replace(authUrl);
    } catch (e) {
      console.error("OIDC redirect failed:", e);
      setError("Login failed: " + e.message);
    }
  }
})();
</script>
</body>
</html>
