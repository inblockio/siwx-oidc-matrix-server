# Relay policy for LiveKit (patches/livekit/0001-relay-policy.patch): a client whose
# address is in one of these ranges gets relay-only ICE over TURN/TLS on :443 from the
# start of a call. See config/relay-policy/README.md for the format and for adding a
# policy. `prefixes:` is generated by scripts/relay-policy-refresh from the ASNs below;
# do not edit it by hand, put hand-maintained ranges in manual_prefixes.
name: ae-carriers
description: >-
  United Arab Emirates fixed and mobile carriers, whose networks filter UDP media:
  e& (Etisalat) AS5384 EMIRATES-INTERNET and AS8966 Etisalat-AS, du AS15802 DU-AS1
  and AS57187 DATAMENA (Virgin Mobile UAE runs on du).
asns: [5384, 8966, 15802, 57187]
