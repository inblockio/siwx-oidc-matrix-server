# LiveKit SFU config for the hermetic LOCAL e2e harness (siwx-e2eh-livekit).
# Based on config/livekit.yaml, with two WSL-specific deviations:
#   - rtc.use_external_ip: false  — external-IP autodetect breaks on the WSL
#     single-host bridge; e2e clients connect via localhost, so no external IP.
#   - room.auto_create: true      — lets the later AV-establishment check
#     (A6.5) create rooms without an admin/management call.
# API keys are injected via the LIVEKIT_KEYS env var (see docker-compose.e2e.yml),
# so the static `keys:` block from prod is intentionally omitted.
port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  port_range_start: 20100
  port_range_end: 20200
  use_external_ip: false
  # No rtc.ips.excludes here, on purpose. A multi-homed deployment
  # (compose-default net + proxy net) excludes the proxy network's subnet from
  # ICE candidates because STUN picks up the wrong interface; see the comment
  # in config/livekit.yaml. This hermetic harness is single-network (podman
  # network `siwx-e2eh-net`, 10.89.1.0/24 when checked on 2026-08-02) and
  # use_external_ip is already false above, so STUN never runs and there is
  # no private candidate to exclude: harness clients connect over the private
  # bridge on purpose and NEED those candidates to reach the SFU.
room:
  auto_create: true
logging:
  level: info
turn:
  enabled: false
