# Element Web nginx server block — copied to /etc/nginx/conf.d/default.conf by
# dockerfiles/Dockerfile.element, replacing the stock nginx-unprivileged block.
#
# Identical to the stock server block EXCEPT the SPA entrypoint (index.html) is
# served with `Cache-Control: no-cache, must-revalidate`, so browsers ALWAYS
# revalidate the HTML and therefore always load the CURRENT content-hashed
# bundles. The stock image serves index.html with no Cache-Control, so browsers
# heuristically cache a stale index.html that references old, since-removed
# /bundles/<hash>/* chunks -> mismatched-chunk TDZ ("Cannot access 'B' before
# initialization" / "Your Element is misconfigured").
#
# Only the HTML entrypoint is affected. Content-hashed assets under
# /bundles/<hash>/ are immutable and keep nginx's default caching, so this image
# changes zero bundle bytes and cannot break fresh or stale-cached clients.
# See docs/superpowers/plans/2026-06-19-element-index-html-no-cache.md.
#
# http-level config (mime types, sendfile, gzip, access_log, conf.d include)
# stays in the base image's /etc/nginx/nginx.conf, which is NOT replaced.

server {
    listen       8080;
    server_name  localhost;

    # SPA entrypoint: always revalidate. `always` keeps the header on 304 Not
    # Modified responses too. A request for "/" is internally redirected here by
    # the `index` directive in `location /`, so BOTH "/" and "/index.html" carry
    # the header while the file is still served from this block.
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Service worker: always revalidate. The worker is what authenticates every
    # media request (it rewrites the legacy /_matrix/media/v3/* URLs the app
    # emits to /_matrix/client/v1/media/* and injects the bearer token), so a
    # browser holding a stale copy silently loses ALL media — downloads and
    # inline images 404 with nothing in the page console. Served from the image
    # without this, sw.js carries no Cache-Control at all and browsers apply
    # heuristic caching to the one file that must never go stale.
    location = /sw.js {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
