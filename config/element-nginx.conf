# Element Web nginx server block — copied to /etc/nginx/conf.d/default.conf by
# dockerfiles/Dockerfile.element, replacing the stock nginx-unprivileged block.
#
# Identical to the stock server block EXCEPT for the two UNHASHED manifests that
# name content-hashed files. Both are served `Cache-Control: no-cache,
# must-revalidate` so a browser can never pair a stale manifest with a bundle
# that no longer contains the files it names:
#
#   /index.html          -> names /bundles/<hash>/*
#   /i18n/languages.json -> names /i18n/<lang>.<hash>.json
#   /sw-boot.js          -> stable-named SW boot shim (not a manifest, but the
#                           same rule: a cached copy would pin old behavior)
#
# The stock image serves BOTH with no Cache-Control at all, which leaves
# browsers free to apply heuristic freshness (RFC 9111 §4.2.2, in practice ~10%
# of the response's age). Every Element upgrade rewrites the hashes and DELETES
# the previous files, so a heuristically-cached manifest points at 404s:
#
#   stale index.html          -> mismatched-chunk TDZ ("Cannot access 'B' before
#                                initialization" / "Your Element is misconfigured")
#   stale i18n/languages.json -> GET i18n/en_EN.<oldhash>.json 404s, the throw in
#                                shared-components' getLanguage() aborts
#                                setLanguage() BEFORE registerTranslations(), and
#                                every _t() then renders its raw key path
#                                ("common|home", "action|search", …)
#
# The i18n case is the 2026-07-31 dev regression after the v1.12.20 -> v1.12.24
# bump: only browsers holding a pre-upgrade languages.json were affected, so it
# reproduced for returning users and never on a fresh profile. Upstream fetches
# the manifest with a plain `fetch("i18n/languages.json")` — default HTTP cache
# mode, no cache-buster — so the freshness decision is entirely ours to make
# here. See packages/shared-components/src/core/i18n/i18n.tsx (v1.12.24) L406,
# L409, L423-432, L434-444.
#
# Only these two manifests are affected. Content-hashed assets under
# /bundles/<hash>/ and /i18n/<lang>.<hash>.json are immutable and keep nginx's
# default caching, so this image changes zero bundle bytes and cannot break
# fresh or stale-cached clients. /config.json is already cache-busted by the app
# itself (`?cachebuster=<ts>`), and a stale /version or /manifest.json is
# self-healing/cosmetic, so none of them need a rule.
# See docs/superpowers/plans/2026-06-19-element-index-html-no-cache.md.
#
# http-level config (mime types, sendfile, gzip, access_log, conf.d include)
# stays in the base image's /etc/nginx/nginx.conf, which is NOT replaced.

server {
    listen       8080;
    server_name  localhost;

    # Version-disclosure banner (checklist S7/Section 5): suppress the nginx
    # version from the `Server` response header and default error pages.
    # Valid in http/server/location per S7; server context is sufficient here
    # since nothing below overrides it. Confirmed FAIL live 2026-07-31
    # (`server: nginx/1.31.3` on both dev and prod) before this fix.
    server_tokens off;

    # Element-origin security headers (checklist S1, Section 1: X-Frame-Options,
    # CSP frame-ancestors, X-Content-Type-Options, X-XSS-Protection). See
    # element-security-headers.inc (copied here from
    # config/element-nginx-security-headers.inc by dockerfiles/Dockerfile.element)
    # for the header values and citations.
    #
    # CRITICAL — nginx add_header inheritance gotcha, do NOT "clean this up":
    # `add_header` is inherited from an outer block (http/server) by a
    # location ONLY IF that location defines NO add_header directives of its
    # own (see nginx docs: "these directives are inherited from the previous
    # level if and only if there are no add_header directives defined on the
    # current level"). `include` splices the .inc file's add_header lines in
    # at parse time, so it counts as "defining add_header on this level" just
    # like writing the lines out by hand. Nearly every location below sets its
    # own Cache-Control via add_header (2026-07-31 cache-correctness fixes),
    # which means the server-level include below is INVISIBLE to every one of
    # them — inheritance breaks the moment a location adds its own
    # add_header. That is why this same `include` line is repeated inside
    # EVERY location block that contains an add_header directive: server
    # level covers only the two locations with no add_header of their own
    # (`location /` and `location = /50x.html`); every other location needs
    # its own copy of this include or it silently loses the security headers.
    include /etc/nginx/conf.d/element-security-headers.inc;

    # SPA entrypoint: always revalidate. `always` keeps the header on 304 Not
    # Modified responses too. A request for "/" is internally redirected here by
    # the `index` directive in `location /`, so BOTH "/" and "/index.html" carry
    # the header while the file is still served from this block.
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/element-security-headers.inc;
    }

    # The SW boot shim is referenced from index.html by a stable (un-hashed)
    # name, so it needs the same always-revalidate treatment: a heuristically
    # cached copy would pin old shim behavior across deploys.
    location = /sw-boot.js {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/element-security-headers.inc;
    }

    # i18n: always revalidate the whole directory, matching app.element.io
    # (which serves even the hashed per-language files max-age=0). The
    # manifest (languages.json) maps a language code to a content-hashed
    # filename; a stale copy names a file the current bundle no longer ships,
    # the 404 aborts setLanguage() before any translation is registered, and
    # the whole UI renders raw i18n keys.
    location /i18n/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/element-security-headers.inc;
    }

    # Hashed bundles: app.element.io parity (max-age=14400, must-revalidate).
    # We previously sent NO header here, which left bundle chunks on unbounded
    # browser heuristics — the stale-chunk staleness class with no ceiling.
    # 4h bounds it while keeping normal loads cheap.
    location /bundles/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=14400, must-revalidate" always;
        include /etc/nginx/conf.d/element-security-headers.inc;
    }

    # sw.js: app.element.io parity. Browsers bypass the HTTP cache for SW
    # update checks by default (updateViaCache="imports"), so this mostly
    # bounds non-update fetches; upstream caps it at 4h, we match.
    location = /sw.js {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=14400, must-revalidate" always;
        include /etc/nginx/conf.d/element-security-headers.inc;
    }

    # Remaining unhashed meta/entry files, all app.element.io parity
    # (they serve max-age=0, must-revalidate on every one of these):
    # /version drives Element's deploy/update detection — a heuristically
    # cached copy silently disables update detection. /config.json is
    # usually cachebusted by the app but not on every path. /mobile_guide/
    # and /jitsi.html are unhashed entry documents referencing hashed assets
    # (the index.html staleness class). element-theme-overrides.css is our
    # own unhashed overlay referenced from index.html.
    location = /version {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/element-security-headers.inc;
    }
    location = /config.json {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/element-security-headers.inc;
    }
    location = /manifest.json {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/element-security-headers.inc;
    }
    location = /jitsi.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/element-security-headers.inc;
    }
    location = /element-theme-overrides.css {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/element-security-headers.inc;
    }
    location /mobile_guide/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/element-security-headers.inc;
    }

    # Download iframe document (FileDownloader sets iframe.src = "usercontent/"):
    # a third unhashed entry document that names a content-hashed script
    # (bundles/<hash>/usercontent.js). A heuristically cached copy from a
    # previous deploy 404s on that script and the download button silently
    # dies — and reloading the app page does NOT refresh this entry (the
    # iframe is fetched at click time). The exact-match block below catches
    # the `index` directive's internal redirect of /usercontent/ so the
    # header is applied to what actually gets served.
    location = /usercontent/index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        include /etc/nginx/conf.d/element-security-headers.inc;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
