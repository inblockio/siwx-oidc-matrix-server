# Element Web nginx server block — copied to /etc/nginx/conf.d/default.conf by
# dockerfiles/Dockerfile.element, replacing the stock nginx-unprivileged block.
#
# Identical to the stock server block EXCEPT for the two UNHASHED manifests that
# name content-hashed files. Both are served `Cache-Control: no-cache,
# must-revalidate` so a browser can never pair a stale manifest with a bundle
# that no longer contains the files it names:
#
#   /index.html          -> names /bundles/<hash>/*
#   /i18n/languages.json -> names /i18n/<lang>.<hash>.json
#
# The stock image serves BOTH with no Cache-Control at all, which leaves
# browsers free to apply heuristic freshness (RFC 9111 §4.2.2, in practice ~10%
# of the response's age). Every Element upgrade rewrites the hashes and DELETES
# the previous files, so a heuristically-cached manifest points at 404s:
#
#   stale index.html          -> mismatched-chunk TDZ ("Cannot access 'B' before
#                                initialization" / "Your Element is misconfigured")
#   stale i18n/languages.json -> GET i18n/en_EN.<oldhash>.json 404s, the throw in
#                                shared-components' getLanguage() aborts
#                                setLanguage() BEFORE registerTranslations(), and
#                                every _t() then renders its raw key path
#                                ("common|home", "action|search", …)
#
# The i18n case is the 2026-07-31 dev regression after the v1.12.20 -> v1.12.24
# bump: only browsers holding a pre-upgrade languages.json were affected, so it
# reproduced for returning users and never on a fresh profile. Upstream fetches
# the manifest with a plain `fetch("i18n/languages.json")` — default HTTP cache
# mode, no cache-buster — so the freshness decision is entirely ours to make
# here. See packages/shared-components/src/core/i18n/i18n.tsx (v1.12.24) L406,
# L409, L423-432, L434-444.
#
# Only these two manifests are affected. Content-hashed assets under
# /bundles/<hash>/ and /i18n/<lang>.<hash>.json are immutable and keep nginx's
# default caching, so this image changes zero bundle bytes and cannot break
# fresh or stale-cached clients. /config.json is already cache-busted by the app
# itself (`?cachebuster=<ts>`), and a stale /version or /manifest.json is
# self-healing/cosmetic, so none of them need a rule.
# See docs/superpowers/plans/2026-06-19-element-index-html-no-cache.md.
#
# http-level config (mime types, sendfile, gzip, access_log, conf.d include)
# stays in the base image's /etc/nginx/nginx.conf, which is NOT replaced.

server {
    listen       8080;
    server_name  localhost;

    # SPA entrypoint: always revalidate. `always` keeps the header on 304 Not
    # Modified responses too. A request for "/" is internally redirected here by
    # the `index` directive in `location /`, so BOTH "/" and "/index.html" carry
    # the header while the file is still served from this block.
    location = /index.html {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # i18n manifest: always revalidate, for exactly the same reason as
    # index.html. It maps a language code to a content-hashed filename
    # ("en" -> "en_EN.69d09df.json"); a stale copy names a file the current
    # bundle no longer ships, the 404 aborts setLanguage() before any
    # translation is registered, and the whole UI renders raw i18n keys.
    # The per-language files it names stay cacheable — they are hashed.
    location = /i18n/languages.json {
        root   /usr/share/nginx/html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # redirect server error pages to the static page /50x.html
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
