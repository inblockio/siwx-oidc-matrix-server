port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  # Below the Linux ephemeral range (32768-60999) so these listeners cannot be
  # squatted by the host's own ephemeral source ports; matches
  # config/livekit.e2e.yaml. MUST match the docker-compose.yml ports mapping,
  # and the host firewall must allow 20100:20200/udp.
  port_range_start: 20100
  port_range_end: 20200
  use_external_ip: true
  # The livekit container is attached to TWO docker networks: its own compose
  # default net (STUN maps it to the host's public IP) and the shared reverse-
  # proxy net (172.18.0.0/16) that exists only so Caddy can reach :7880. STUN
  # fails on the proxy-net interface and LiveKit then advertises that private
  # bridge IP AS IF it were external ("using external IPs" lists two entries).
  # When a real client's ICE selects it, DTLS times out and the call carries
  # no media. Excluding the proxy-net subnet removes that candidate entirely.
  # VERIFY after every restart: `docker logs <livekit> | grep 'using external
  # IPs'` must show exactly ONE entry (the public IP).
  ips:
    excludes:
      - "172.18.0.0/16"
room:
  auto_create: false
logging:
  level: info
# Embedded TURN with TLS terminated at the edge (external_tls). It works only
# with, in order: an edge Caddy that carries the `layer4` module (the CI-built
# `caddy-l4` image, published by .github/workflows/docker.yml as
# ghcr.io/inblockio/siwx-oidc-matrix-server/caddy-l4), a `servers :443
# { listener_wrappers { layer4 { ... } } }` block plus a dummy
# cert-automation site for the TURN domain in that edge's Caddyfile, a DNS
# record for the TURN domain pointing at the host, NO host publish of tls_port
# (5349) — it must stay reachable only from the edge — and
# `ufw allow 3478/udp` (TURN-UDP; no ufw rule needed for 5349, edge-internal
# only). Do NOT set `enabled: true` on a deployment without that edge: with
# external_tls but no SNI-split edge in front of 443, the advertised `turns:`
# URL on port 443 has nothing correct to land on.
#
turn:
  enabled: true
  domain: turn.matrix.inblock.io
  external_tls: true
  tls_port: 5349
  udp_port: 3478
