port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  # Below the Linux ephemeral range (32768-60999) so these listeners cannot be
  # squatted by the host's own ephemeral source ports; matches
  # config/livekit.e2e.yaml. MUST match the docker-compose.yml ports mapping,
  # and the host firewall must allow 20100:20200/udp.
  port_range_start: 20100
  port_range_end: 20200
  use_external_ip: true
  # The livekit container is attached to TWO docker networks: its own compose
  # default net (STUN maps it to the host's public IP) and the shared reverse-
  # proxy net (172.18.0.0/16) that exists only so Caddy can reach :7880. STUN
  # fails on the proxy-net interface and LiveKit then advertises that private
  # bridge IP AS IF it were external ("using external IPs" lists two entries).
  # When a real client's ICE selects it, DTLS times out and the call carries
  # no media. Excluding the proxy-net subnet removes that candidate entirely.
  # VERIFY after every restart: `docker logs <livekit> | grep 'using external
  # IPs'` must show exactly ONE entry (the public IP).
  ips:
    excludes:
      - "172.18.0.0/16"
room:
  auto_create: false
logging:
  level: info
# Embedded TURN — NOT enabled in production yet. Validated first on
# dev-staging (config/livekit.dev-staging.yaml, TLS-edge-terminated
# variant) — see docs/superpowers/plans/2026-08-03-turn-tls-edge-termination.md
# for the design + hypothesis register and
# docs/superpowers/plans/2026-08-02-livekit-embedded-turn.md for the
# original embedded-TURN rollout this superseded. Graduation to prod needs,
# in order: the CI-built `caddy-l4` image (published by
# .github/workflows/docker.yml as
# ghcr.io/inblockio/siwx-oidc-matrix-server/caddy-l4) adopted by
# portal-caddy-1 (prod's Caddy is a DIFFERENT, bind-mounted deployment — see
# Caddyfile.production's reference block below), the matching `servers :443
# { listener_wrappers { layer4 { ... } } }` block + a `turn.matrix.inblock.io`
# dummy cert-automation site added to the live prod Caddyfile, DNS
# `turn.matrix.inblock.io -> 142.93.168.4` (already created), NO host publish
# of tls_port (5349) — it must stay reachable only from the edge — and
# `ufw allow 3478/udp` (TURN-UDP; no ufw rule needed for 5349, edge-internal
# only). Do NOT flip `enabled: true` here before that edge work lands: with
# external_tls but no SNI-split edge in front of 443, the advertised
# `turns:matrix.inblock.io:443` URL has nothing correct to land on.
#
turn:
  enabled: true
  domain: turn.matrix.inblock.io
  external_tls: true
  tls_port: 5349
  udp_port: 3478
