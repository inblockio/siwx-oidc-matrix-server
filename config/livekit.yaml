port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  # Below the Linux ephemeral range (32768-60999) so these listeners cannot be
  # squatted by the host's own ephemeral source ports; matches
  # config/livekit.e2e.yaml. MUST match the docker-compose.yml ports mapping,
  # and the host firewall must allow 20100:20200/udp.
  port_range_start: 20100
  port_range_end: 20200
  use_external_ip: true
  # A LiveKit container on TWO docker networks (its compose default network,
  # where STUN maps it to the host's public IP, and the reverse-proxy network
  # `portal-net`, which exists only so the proxy can reach :7880) can advertise
  # the proxy network's private bridge IP as if it were external: STUN fails on
  # that interface, the log line "using external IPs" lists two entries, and a
  # client whose ICE picks the private one times out in DTLS with no media.
  # Exclude that network's subnet. It is host-specific (Docker assigns it when
  # the network is created), so none is set here; look it up with
  #   docker network inspect portal-net -f '{{range .IPAM.Config}}{{.Subnet}}{{end}}'
  # and uncomment. After a restart, `docker logs <livekit> | grep 'using
  # external IPs'` must show exactly one entry, the public IP.
  # ips:
  #   excludes:
  #     - "<subnet of portal-net>"
room:
  auto_create: false
logging:
  level: info
# Embedded TURN with TLS terminated at the edge (external_tls). OFF by default,
# because it works only with, in order: an edge Caddy that carries the `layer4`
# module (the CI-built `caddy-l4` image, published by
# .github/workflows/docker.yml as ghcr.io/inblockio/siwx-oidc-matrix-server/caddy-l4),
# a `servers :443 { listener_wrappers { layer4 { ... } } }` block plus a dummy
# cert-automation site for the TURN domain in that edge's Caddyfile, a DNS
# record for the TURN domain pointing at the host, NO host publish of tls_port
# (5349) — it must stay reachable only from the edge — and the host firewall
# allowing 3478/udp (TURN-UDP; 5349 is edge-internal only). With external_tls
# but no SNI-split edge in front of 443, the advertised `turns:` URL on port
# 443 has nothing correct to land on. To enable it, set `enabled: true` and
# `domain` to your TURN host name; skills/matrix-rtc-transport-specialist.md,
# "Embedded TURN", has the edge configuration.
#
turn:
  enabled: false
  domain: turn.example.org
  external_tls: true
  tls_port: 5349
  udp_port: 3478
