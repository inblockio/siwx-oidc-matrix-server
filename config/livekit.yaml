port: 7880
bind_addresses:
  - "0.0.0.0"
rtc:
  tcp_port: 7881
  # Below the Linux ephemeral range (32768-60999) so these listeners cannot be
  # squatted by the host's own ephemeral source ports; matches
  # config/livekit.e2e.yaml. MUST match the docker-compose.yml ports mapping,
  # and the host firewall must allow 20100:20200/udp.
  port_range_start: 20100
  port_range_end: 20200
  use_external_ip: true
  # The livekit container is attached to TWO docker networks: its own compose
  # default net (STUN maps it to the host's public IP) and the shared reverse-
  # proxy net (172.18.0.0/16) that exists only so Caddy can reach :7880. STUN
  # fails on the proxy-net interface and LiveKit then advertises that private
  # bridge IP AS IF it were external ("using external IPs" lists two entries).
  # When a real client's ICE selects it, DTLS times out and the call carries
  # no media. Excluding the proxy-net subnet removes that candidate entirely.
  # VERIFY after every restart: `docker logs <livekit> | grep 'using external
  # IPs'` must show exactly ONE entry (the public IP).
  ips:
    excludes:
      - "172.18.0.0/16"
room:
  auto_create: false
logging:
  level: info
# Embedded TURN — NOT enabled in production yet. Validated first on
# dev-staging (config/livekit.dev-staging.yaml); see the graduation
# checklist in docs/superpowers/plans/2026-08-02-livekit-embedded-turn.md
# before flipping `enabled: true` here. In order: install
# scripts/livekit-turn-cert-sync.sh + its systemd timer on THIS box, open
# tls_port+udp_port on ufw and the DO cloud firewall, and resolve the 443
# advertisement gotcha (livekit-server v1.12.0 hardcodes the TURN-TLS
# client URL to :443 regardless of tls_port — Caddy owns 443 here, so that
# leg is inert without a dedicated IP+DNS or an SNI/L4-demux edge proxy;
# TURN-UDP works immediately once enabled).
#
# turn:
#   enabled: true
#   domain: matrix.inblock.io
#   cert_file: /etc/livekit-turn/tls.crt
#   key_file: /etc/livekit-turn/tls.key
#   tls_port: 5349
#   udp_port: 3478
turn:
  enabled: false
