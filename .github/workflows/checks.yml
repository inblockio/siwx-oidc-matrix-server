# Fast, hermetic checks on every pull request and on main.
#
# Until this workflow the repository had no pull-request checks at all:
# docker.yml only builds and publishes images on a push to main. So a patch
# registry could drift from the patches it describes and nothing said so. Every
# step of the `patches` job reads the checked-out tree only (no network, no
# container runtime, no secrets), which also makes it safe on pull requests from
# forks. The `patch-unit-tests` job is the one exception: it needs network (it
# clones Element Web and installs its dependencies) and a container runtime, and
# still uses no secrets and a read-only token, so it is just as safe on forks.
#
# Deliberately NO `paths-ignore: ['**.md']`: the patch registries are markdown,
# and a registry-only edit is exactly what check-patch-registry.sh must see.
#
# `lk-jwt-membership-accept` needs network for one thing only: it downloads the
# pinned mikefarah yq (the entrypoint's own yq), verified by SHA-256, the same
# version and digest as dockerfiles/Dockerfile. No container runtime, no secrets.
#
# Not run here: scripts/check-did-localpart-vectors.sh. It compares against
# siwx-oidc's fixture fetched over the network with `gh api`, so its result
# depends on another repository's main, not on the pull request.
name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  patches:
    name: Vendored patches
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Pinned by commit, not by a movable tag; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Registry, Dockerfile and README agree on every patch
        run: scripts/check-patch-registry.sh

      - name: Hunk headers match their bodies
        run: python3 scripts/check-patch-hunks.py

      - name: Copy Markdown conformance vectors match the patch
        run: python3 scripts/check-copy-markdown-vectors.py

  # The unit tests our Element Web patches carry have to run somewhere: they are
  # written against the patched upstream tree, so only that tree can run them.
  # The Dockerfile's `patch-tests` stage builds exactly the tree the image is
  # built from (pinned tag, every patch, lockfile install) and runs
  # scripts/element-patch-tests.sh on it; the stage is never part of the image.
  # A cold run clones, installs and builds the workspace packages, so budget
  # minutes, not seconds.
  patch-unit-tests:
    name: Element patch unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Dockerfile.element needs BuildKit (RUN --mount, ADD --checksum).
      DOCKER_BUILDKIT: '1'
    steps:
      # Pinned by commit, not by a movable tag; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tests carried by the patches, on the patched tag tree
        run: docker build --progress=plain --target patch-tests -f dockerfiles/Dockerfile.element .

  # The builder stage of dockerfiles/Dockerfile.livekit: upstream at the pinned
  # commit, patches/livekit/ applied, the patch tests run, and this repository's
  # config/relay-policy/ loaded by the same code LiveKit starts with. The image
  # itself is built only after a merge (docker.yml), so without this job a broken
  # policy file would first show up as a LiveKit that refuses to start.
  livekit-patch-tests:
    name: LiveKit patch tests and relay policy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Pinned by commit, not by a movable tag; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Patch tests and policy load, on the patched tag tree
        run: docker build --progress=plain --target builder -f dockerfiles/Dockerfile.livekit .

  # scripts/lk-jwt-membership-accept.sh extracts apply_lk_jwt_membership from the
  # entrypoint and runs it against fixture homeserver.yaml files: idempotency, the
  # users-namespace regex, and every refusal path. The job also runs the secret
  # store mode's acceptance script, which needs the same pinned yq.
  lk-jwt-membership-accept:
    name: lk-jwt membership accept
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Pinned by commit, not by a movable tag; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same version and SHA-256 as the `yq` download in dockerfiles/Dockerfile;
      # bump them together. The runner image's own yq is not mikefarah v4.
      - name: Install pinned yq v4
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o "$RUNNER_TEMP/bin/yq"
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  $RUNNER_TEMP/bin/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/yq"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: apply_lk_jwt_membership acceptance cases
        env:
          SIWX_ACCEPT_SCRATCH: ${{ runner.temp }}/lk-jwt-accept
        run: scripts/lk-jwt-membership-accept.sh

      # The whole entrypoint against scratch directories with a stubbed /start.py:
      # the rendered config with the mode off against a committed golden (the image
      # must behave as before), the secret store mode's cases and every refusal.
      # No container runtime.
      - name: Synapse secret store acceptance cases
        env:
          SIWX_ACCEPT_SCRATCH: ${{ runner.temp }}/synapse-secret-store-accept
        run: scripts/synapse-secret-store-accept.sh

      # apply_directory_search (docs/directory-search.md) extracted from the entrypoint
      # and run against fixture homeserver.yaml files: registration, removal when the
      # setting is emptied, every refusal, other modules kept, byte-neutral when off.
      # The module's own behaviour is tested by synapse-modules/run-tests.sh, which
      # needs a Rust build of Synapse and is run in the Synapse bump procedure.
      - name: apply_directory_search acceptance cases
        env:
          SIWX_ACCEPT_SCRATCH: ${{ runner.temp }}/directory-search-accept
        run: scripts/directory-search-accept.sh

  # scripts/storage-controller-credential-test.sh runs the storage controller against a
  # scratch stack with a stub `docker`: the MAS shared secret comes from the systemd
  # credential `mas_shared_secret` when the unit passes credentials (an error when it
  # passes others but not this one), else from .env, and neither it nor the admin token
  # reaches an argument vector (the host's docker, or curl inside the container) or a log
  # line.
  storage-controller-credential:
    name: Storage controller secret source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Pinned by commit, not by a movable tag; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Credential, .env, both, neither
        run: scripts/storage-controller-credential-test.sh

  # The Synapse secret store mode (docs/synapse-secret-files.md) is tested twice:
  # the logic in the `lk-jwt-membership-accept` job above (it already has the pinned
  # yq), and here the real image.
  #
  # `synapse-secret-store-e2e` builds the Synapse image exactly as docker.yml does
  # (the build is not published) and runs it with throwaway volumes and no network:
  # as 991:991 with a group_add group that alone can read the secret files, a real
  # Synapse start in store mode with --no-secrets-in-config, the refusals that need
  # a runtime, and the image without the store variable. Public images and generated
  # values only; no secrets and a read-only token.
  synapse-secret-store-e2e:
    name: Synapse secret store e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # dockerfiles/Dockerfile needs BuildKit (ADD --checksum).
      DOCKER_BUILDKIT: '1'
    steps:
      # Pinned by commit, not by a movable tag; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the Synapse image
        run: docker build --progress=plain -f dockerfiles/Dockerfile -t synapse-under-test .

      - name: Secret store mode, end to end
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/cache
        run: scripts/synapse-secret-store-e2e.sh --image synapse-under-test
