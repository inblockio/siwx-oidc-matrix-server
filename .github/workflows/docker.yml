name: Publish Docker

on:
  push:
    branches: [main, dev]
    tags: ['*']
    # Doc-only commits were rebuilding+moving the :main digest with no code
    # change (observed 2026-07-31) — that breaks digest-based promotion
    # tracking. Skip the build when a push touches only docs/markdown.
    # Deliberately NOT excluding .github/workflows/** — a workflow-file
    # change must still trigger a build. Does not affect the `release` or
    # `workflow_dispatch` triggers below (paths-ignore only scopes `push`).
    paths-ignore: ['docs/**', '**.md']
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      # The two images are independent artifacts: a transient failure in one
      # build must not cancel the other (observed 2026-07-31: a synapse build
      # flake cancelled a healthy element-web build mid-run, stalling a
      # staged deploy).
      fail-fast: false
      matrix:
        include:
          - image: synapse
            dockerfile: dockerfiles/Dockerfile
          - image: element-web
            dockerfile: dockerfiles/Dockerfile.element
          # caddy-l4: prod-graduation vehicle for TURN-TLS edge termination
          # (docs/superpowers/plans/2026-08-03-turn-tls-edge-termination.md).
          # dev-staging currently builds this image ON THE BOX (T1 predates
          # CI adoption there); this job is what lets the portal Caddy on
          # prod (and, eventually, dev-staging) pull a CI-built, digest-
          # pinnable image instead of building locally.
          - image: caddy-l4
            dockerfile: dockerfiles/Dockerfile.caddy-l4
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploys the just-published `main` images to the dev-staging box
  # (dev-aquafire, 207.154.209.103). Only fires on an actual push to `main`
  # (not tag pushes or GitHub releases, both of which also satisfy the `on:
  # push` trigger above) or an explicit manual dispatch.
  #
  # The SSH key is a dedicated, restricted deploy key (see
  # docs/2026-07-30-dev-staging-dev-aquafire.md, "CI auto-deploy — pending
  # user actions"): the box's authorized_keys pins it to a forced command
  # (`/home/dev/matrix-staging/ci-deploy.sh`) with no-pty/no-port-forwarding/
  # no-agent-forwarding/no-X11-forwarding, so this key can never do anything
  # on the box except run that one script — the `deploy` argument below is
  # never seen by the server, it's just a readable label in the Actions log.
  #
  # The host key is pinned to a known_hosts line captured directly from the
  # box (`ssh-keyscan -p 8022 207.154.209.103`) rather than trusted on first
  # use, so a DNS hijack or MITM can't silently swap in a different host.
  deploy-dev-staging:
    name: Deploy to dev-staging
    needs: build-and-push
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      # Secret-presence guard: DEV_STAGING_DEPLOY_KEY does not exist yet
      # (pending PAT rotation, see docs/2026-07-30-dev-staging-dev-aquafire.md
      # §9). Without this guard every push-to-main run of this job would go
      # red. The box's pull-model systemd timer (matrix-staging-deploy.timer)
      # is the primary auto-deploy mechanism in the meantime, so a missing
      # secret here is expected steady state, not a failure — this job SKIPS
      # cleanly (green) rather than erroring, and every step below is gated
      # on the same condition.
      - name: Check deploy key configured
        id: check-secret
        run: echo "ok=${{ secrets.DEV_STAGING_DEPLOY_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Install deploy key
        if: steps.check-secret.outputs.ok == 'true'
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "${{ secrets.DEV_STAGING_DEPLOY_KEY }}" > ~/.ssh/dev_staging_deploy_key
          chmod 600 ~/.ssh/dev_staging_deploy_key

      - name: Pin dev-aquafire host key
        if: steps.check-secret.outputs.ok == 'true'
        run: |
          install -m 700 -d ~/.ssh
          cat > ~/.ssh/dev_staging_known_hosts <<'EOF'
          [207.154.209.103]:8022 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILz/wItQKuTDUzsdBpvqVETE9+CHHlKMgXh6rbimvWy0
          EOF

      - name: Deploy to dev-staging (forced command runs ci-deploy.sh)
        if: steps.check-secret.outputs.ok == 'true'
        run: |
          ssh -p 8022 \
            -i ~/.ssh/dev_staging_deploy_key \
            -o UserKnownHostsFile=~/.ssh/dev_staging_known_hosts \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            dev@207.154.209.103 'deploy'

      - name: Clean up deploy key
        if: always() && steps.check-secret.outputs.ok == 'true'
        run: rm -f ~/.ssh/dev_staging_deploy_key

      - name: Deploy skipped (secret not configured)
        if: steps.check-secret.outputs.ok != 'true'
        run: |
          echo "::notice title=Push-model deploy skipped::DEV_STAGING_DEPLOY_KEY is not set in this repo, so the push-model CI deploy is dormant. The dev-staging box converges via its own pull-model systemd timer (matrix-staging-deploy.timer, polls every 5 minutes) instead. See docs/2026-07-30-dev-staging-dev-aquafire.md section 9 to enable this job once the secret exists." | tee -a "$GITHUB_STEP_SUMMARY"
