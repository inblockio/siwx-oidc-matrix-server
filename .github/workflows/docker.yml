name: Publish Docker

on:
  push:
    # `main` is the only trunk as of 2026-09-01; `dev` was consolidated into
    # it and deleted. Re-adding a second long-lived branch here means a second
    # floating tag, which is how prod and dev-staging ended up tracking
    # different lines in the first place.
    branches: [main]
    tags: ['*']
    # Doc-only commits were rebuilding+moving the :main digest with no code
    # change (observed 2026-07-31) — that breaks digest-based promotion
    # tracking. Skip the build when a push touches only docs/markdown.
    # Deliberately NOT excluding .github/workflows/** — a workflow-file
    # change must still trigger a build. Does not affect the `release` or
    # `workflow_dispatch` triggers below (paths-ignore only scopes `push`).
    paths-ignore: ['docs/**', '**.md']
  release:
    types: [published]
  workflow_dispatch:

# Read-only by default. A job that needs more asks for it by name.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    permissions:
      contents: read    # actions/checkout
      packages: write   # push the images to GHCR
    strategy:
      # The images are independent artifacts: a transient failure in one
      # build must not cancel the other (observed 2026-07-31: a synapse build
      # flake cancelled a healthy element-web build mid-run, stalling a
      # staged deploy).
      fail-fast: false
      matrix:
        # `licenses` is each image's org.opencontainers.image.licenses label,
        # an SPDX expression taken from NOTICE. metadata-action would stamp
        # the repository's own license (Apache-2.0) on all three, which is
        # wrong for an image that ships AGPL Synapse or Element Web. The
        # expressions name what this repository puts in the image, not every
        # package of the base image (those are listed, with their license
        # texts, under /usr/share/licenses/ in the image; see NOTICE,
        # "Container images").
        include:
          # Synapse with our patch (AGPL-3.0-or-later), our entrypoint
          # (Apache-2.0), yq (MIT).
          - image: synapse
            dockerfile: dockerfiles/Dockerfile
            licenses: 'AGPL-3.0-or-later AND Apache-2.0 AND MIT'
          # Element Web with our patches (AGPL-3.0-only OR GPL-3.0-only; the
          # en_EN.json strings they add are AGPL-3.0-or-later OR
          # GPL-3.0-or-later), our overlay (Apache-2.0), the nginx skeleton in
          # config/element-nginx.conf (BSD-2-Clause), the Nord theme in
          # config/element-config.json (Unlicense), and the brand assets,
          # which are not licensed (NOTICE defines
          # LicenseRef-inblockio-brand-assets under "Brand assets").
          - image: element-web
            dockerfile: dockerfiles/Dockerfile.element
            licenses: '(AGPL-3.0-only OR GPL-3.0-only) AND (AGPL-3.0-or-later OR GPL-3.0-or-later) AND Apache-2.0 AND BSD-2-Clause AND Unlicense AND LicenseRef-inblockio-brand-assets'
          # caddy-l4: Caddy with the layer4 module, the edge that terminates
          # TURN-TLS on :443 by SNI (see dockerfiles/Dockerfile.caddy-l4).
          # Publishing it here lets a deployment's edge pull a CI-built,
          # digest-pinnable image instead of building it on the host. Caddy,
          # caddy-l4 and caddy-ratelimit are all Apache-2.0.
          - image: caddy-l4
            dockerfile: dockerfiles/Dockerfile.caddy-l4
            licenses: 'Apache-2.0'
    steps:
      # Pinned by commit, not by a movable tag; the comment names the release.
      # All four run on Node 24 (runs.using in each action.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
          # A custom label replaces the generated label of the same name
          # (src/meta.ts, getOCIAnnotationsWithCustoms: later keys win).
          labels: |
            org.opencontainers.image.licenses=${{ matrix.licenses }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Deploys the just-published `main` images to a dev-staging host. Only fires
  # on an actual push to `main` (not tag pushes or GitHub releases, both of
  # which also satisfy the `on: push` trigger above) or an explicit manual
  # dispatch OF `main`.
  #
  # A dispatch of any other branch builds branch-tagged images only
  # (`:<branch>`, `:sha-<sha>`; `latest` is gated on the default branch and no
  # rule emits `:main`), so a deploy from it could only re-converge the host on
  # the `.env` pins it already has. It is therefore never wanted, and it would
  # turn "build me a candidate image" into a touch of a host carrying real users
  # the day the deploy secrets are configured. Stage a branch image by pinning
  # its digest in the host's SYNAPSE_IMAGE_REF / ELEMENT_IMAGE_REF.
  #
  # DORMANT unless ALL FIVE secrets below are set. Without them (in a fork, or
  # here while deploys are manual) the job skips cleanly (green), never red:
  #   DEV_STAGING_DEPLOY_KEY   private half of a dedicated, restricted deploy key
  #   DEV_DEPLOY_HOST          host name or IP address of the target
  #   DEV_DEPLOY_PORT          the target's SSH port
  #   DEV_DEPLOY_USER          the SSH user on the target
  #   DEV_DEPLOY_KNOWN_HOSTS   the target's pinned known_hosts line(s)
  # Host, port and user are secrets, not repository variables: variables are
  # printed unmasked in the Actions log of a public repository.
  #
  # The target's authorized_keys must pin the deploy key to a forced command
  # (its deploy script) with no-pty,no-port-forwarding,no-agent-forwarding,
  # no-X11-forwarding, so this key can never do anything on the target except
  # run that one script. The `deploy` argument below is never seen by the
  # server; it is only a readable label in the Actions log.
  #
  # The host key is pinned (captured once from the target with
  # `ssh-keyscan -p <port> <host>` and stored in DEV_DEPLOY_KNOWN_HOSTS) rather
  # than trusted on first use, so a DNS hijack or MITM cannot silently swap in
  # a different host.
  deploy-dev-staging:
    name: Deploy to dev-staging
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04
    # No token scope at all: this job checks nothing out and calls no GitHub
    # API. Its only credentials are the deploy secrets below.
    permissions: {}
    steps:
      # Secret-presence guard. A job-level `if:` cannot read `secrets`, so this
      # step computes the gate once and every step below is gated on it. A
      # missing secret is the intended steady state while deploys are manual,
      # so the job skips instead of failing.
      - name: Check deploy secrets configured
        id: check-secret
        run: echo "ok=${{ secrets.DEV_STAGING_DEPLOY_KEY != '' && secrets.DEV_DEPLOY_HOST != '' && secrets.DEV_DEPLOY_PORT != '' && secrets.DEV_DEPLOY_USER != '' && secrets.DEV_DEPLOY_KNOWN_HOSTS != '' }}" >> "$GITHUB_OUTPUT"

      # Through env:, never interpolated into the script: an expression inside
      # `run:` is pasted into the shell source before it runs.
      - name: Install deploy key
        if: steps.check-secret.outputs.ok == 'true'
        env:
          DEV_STAGING_DEPLOY_KEY: ${{ secrets.DEV_STAGING_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          umask 077
          printf '%s\n' "$DEV_STAGING_DEPLOY_KEY" > ~/.ssh/dev_staging_deploy_key
          chmod 600 ~/.ssh/dev_staging_deploy_key

      - name: Pin the deploy target's host key
        if: steps.check-secret.outputs.ok == 'true'
        env:
          DEV_DEPLOY_KNOWN_HOSTS: ${{ secrets.DEV_DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEV_DEPLOY_KNOWN_HOSTS" > ~/.ssh/dev_staging_known_hosts

      - name: Deploy to dev-staging (forced command on the target)
        if: steps.check-secret.outputs.ok == 'true'
        env:
          DEV_DEPLOY_HOST: ${{ secrets.DEV_DEPLOY_HOST }}
          DEV_DEPLOY_PORT: ${{ secrets.DEV_DEPLOY_PORT }}
          DEV_DEPLOY_USER: ${{ secrets.DEV_DEPLOY_USER }}
        run: |
          ssh -p "$DEV_DEPLOY_PORT" \
            -i ~/.ssh/dev_staging_deploy_key \
            -o UserKnownHostsFile=~/.ssh/dev_staging_known_hosts \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            "$DEV_DEPLOY_USER@$DEV_DEPLOY_HOST" 'deploy'

      - name: Clean up deploy key
        if: always() && steps.check-secret.outputs.ok == 'true'
        run: rm -f ~/.ssh/dev_staging_deploy_key

      - name: Deploy skipped (secrets not configured)
        if: steps.check-secret.outputs.ok != 'true'
        run: |
          echo "::notice title=Push-model deploy skipped::DEV_STAGING_DEPLOY_KEY and the DEV_DEPLOY_HOST, DEV_DEPLOY_PORT, DEV_DEPLOY_USER and DEV_DEPLOY_KNOWN_HOSTS secrets are not all set in this repo, so the push-model CI deploy is dormant." | tee -a "$GITHUB_STEP_SUMMARY"
