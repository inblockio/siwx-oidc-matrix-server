services:
  matrix_synapse:
    # SYNAPSE_IMAGE_REF / ELEMENT_IMAGE_REF (not a shared IMAGE_TAG — see
    # 2026-07-31 note below): full image refs, so each image can be pinned to
    # its OWN digest, including the digest-only `repo@sha256:…` form. Kept
    # separate on purpose — a single `IMAGE_TAG:${TAG}` applied to both
    # `synapse:${TAG}` and `element-web:${TAG}` cannot express two different
    # digests for the same tag string, and GHCR sha-tags have been observed to
    # be republishable (element-web:sha-4a3d434 drifted from the bytes
    # originally deployed under that tag), so tag-only pinning is not
    # sufficient. Mirrors docker-compose.dev-staging.yml. Defaults track
    # `:main` so a fresh checkout with no overrides still starts (same
    # fallback behavior the old shared IMAGE_TAG had).
    image: ${SYNAPSE_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc-matrix-server/synapse:main}
    restart: unless-stopped
    expose:
      - "${MATRIX_PORT}"
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_HOST}
      SYNAPSE_REPORT_STATS: ${MATRIX_REPORT_STATS}
      MATRIX_ADMIN_DID: ${MATRIX_ADMIN_DID:-}
      MAS_SHARED_SECRET: ${MAS_SHARED_SECRET}
    env_file:
      - .env
    depends_on:
      siwx-oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:${MATRIX_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - matrix_data:/data
    networks:
      - portal-net
      - default

  redis:
    # REDIS_IMAGE_REF: env-overridable digest-pinned ref — same pattern as
    # SYNAPSE_IMAGE_REF/ELEMENT_IMAGE_REF in docker-compose.dev-staging.yml.
    # Default = what production currently runs (redis:latest resolving to
    # this digest, Redis 8.8.0, verified 2026-07-31 via `docker inspect` +
    # `redis-server --version` on agentic.inblock.io), so prod's next
    # `docker compose up -d` with no override is a no-op, not a surprise
    # upgrade. Do NOT bump this default without a deliberate compat check:
    # dev-staging independently runs a NEWER redis (8.10.0, digest
    # 077ba791...) against its own AOF file, and the two have already
    # diverged — a downgrade of either box against an existing AOF is a
    # data-loss risk, not just a version bump.
    image: ${REDIS_IMAGE_REF:-redis:latest@sha256:aa049e689e141a4358ad1d4562dc49c88a89fbab711fd8fcc33f684c80b26301}
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - default

  siwx-oidc:
    # Built by the separate siwx-oidc repo, so it is versioned independently of
    # synapse + element-web. SIWX_OIDC_IMAGE_REF is a FULL image ref (not a
    # bare tag, which the old SIWX_OIDC_TAG was) so that a digest-only
    # `ghcr.io/inblockio/siwx-oidc@sha256:…` pin is expressible — the promoted
    # digests are tagged `:dev` on GHCR while `:main` resolves elsewhere
    # (builds are not reproducible), so a tag name would misdescribe the bytes.
    # Defaults to :main so a fresh checkout with no overrides still starts.
    image: ${SIWX_OIDC_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc:main}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SIWEOIDC_REDIS_URL: "redis://redis"
      SIWEOIDC_ADDRESS: 0.0.0.0
      SIWEOIDC_HOST: ${SIWEOIDC_HOST}
      SIWEOIDC_PORT: ${SIWEOIDC_PORT}
      SIWEOIDC_BASE_URL: ${SIWEOIDC_BASE_URL}
      SIWEOIDC_SIGNING_KEY_PEM: ${SIWEOIDC_SIGNING_KEY_PEM}
      SIWEOIDC_MAS_SHARED_SECRET: ${MAS_SHARED_SECRET}
      SIWEOIDC_SYNAPSE_ENDPOINT: http://matrix_synapse:${MATRIX_PORT}
      SIWEOIDC_REQUIRE_SECRET: "false"
      SIWEOIDC_SUPPORTED_DID_METHODS: '["pkh","key"]'
      SIWEOIDC_MATRIX_SERVER_NAME: ${MATRIX_HOST}
      RUST_LOG: ${RUST_LOG}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${SIWEOIDC_PORT}/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - portal-net
      - default

  element-web:
    # See SYNAPSE_IMAGE_REF comment above — same split-var rationale.
    image: ${ELEMENT_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc-matrix-server/element-web:main}
    restart: unless-stopped
    environment:
      MATRIX_BASE_URL: ${MATRIX_BASE_URL}
      MATRIX_HOST: ${MATRIX_HOST}
      CLIENT_HOST: ${CLIENT_HOST}
      SIWEOIDC_BASE_URL: ${SIWEOIDC_BASE_URL}
    volumes:
      - ./config/element-config.json:/app/config.json.src:ro
      - ./entrypoints/element_entrypoint.sh:/docker-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      matrix_synapse:
        condition: service_healthy
    networks:
      - portal-net
      - default

  livekit:
    # Pinned: an unpinned :latest jumps SFU versions on any `docker compose pull`
    # (deploy.sh), which can change call behavior unannounced. Bump deliberately.
    image: livekit/livekit-server:v1.12.0
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_KEY}: ${LIVEKIT_SECRET}"
    ports:
      - "7881:7881/tcp"
      # Below the Linux ephemeral range (32768-60999) so these listeners cannot
      # collide with the host's own ephemeral source ports. MUST match
      # rtc.port_range_start/end in config/livekit.yaml exactly, and the host
      # firewall must allow 20100:20200/udp before this is rolled out (T4,
      # docs/superpowers/plans/2026-08-01-av-hardening-config.md).
      - "20100-20200:20100-20200/udp"
      # Embedded TURN (see docs/superpowers/plans/2026-08-03-turn-tls-edge-
      # termination.md). UDP leg only: TURN-TLS terminates at the edge
      # (caddy-l4 SNI split on 443 → plaintext TURN to container port 5349
      # over the proxy network), so 5349 must NOT be host-published. ufw must
      # allow 3478/udp.
      - "3478:3478/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
    healthcheck:
      # busybox wget (the image has no curl); GET / is LiveKit's unauthenticated
      # liveness endpoint. It answers 406 until the node publishes its first
      # stats tick — measured 8s from container start on v1.12.0, most of it the
      # use_external_ip STUN lookup — hence start_period. Verified against
      # livekit/livekit-server:v1.12.0 + this config on 2026-08-01.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7880/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portal-net
      - default

  lk-jwt-service:
    # LK_JWT_IMAGE_REF: env-overridable digest-pinned ref, same pattern as
    # REDIS_IMAGE_REF above. Default = what production currently runs
    # (verified 2026-07-31 via `docker inspect` on agentic.inblock.io;
    # dev-staging runs the SAME digest, so this default is safe for both
    # boxes' next `up -d`).
    # Tag is "0.5.0": GHCR drops the "v" of the v0.5.0 release (2026-06-03), and
    # both `0.5.0` and `latest` resolved to the digest below when checked
    # against the GHCR API on 2026-08-01. Same bytes as the previous pin — this
    # only replaces the moving `latest` label, so a `compose pull` can no longer
    # change call behavior unannounced (which is how the hard
    # LIVEKIT_FULL_ACCESS_HOMESERVERS requirement below arrived unnoticed).
    image: ${LK_JWT_IMAGE_REF:-ghcr.io/element-hq/lk-jwt-service:0.5.0@sha256:29918567e6b7cd920e2853b4cd6848ce01b79947c3d19a9f1ed5b74f0a2a88bf}
    restart: unless-stopped
    environment:
      # MUST stay the PUBLIC wss:// URL — do not "fix" it to http://livekit:7880.
      # v0.5.0 uses LIVEKIT_URL for BOTH the client-facing SFU URL it hands out
      # AND its own server-side RoomService (CreateRoom) client; there is no
      # separate override for the latter (LIVEKIT_CS_API_URL_OVERRIDES on `main`
      # is the Matrix CS-API, not LiveKit). So the CreateRoom call hairpins back
      # in through Caddy, which is why the /livekit/sfu/twirp/* block there is
      # scoped to non-private source IPs. Rationale + the live check this still
      # needs: T6/H5, docs/superpowers/plans/2026-08-01-av-hardening-config.md.
      LIVEKIT_URL: "wss://${MATRIX_HOST}/livekit/sfu"
      LIVEKIT_KEY: "${LIVEKIT_KEY}"
      LIVEKIT_SECRET: "${LIVEKIT_SECRET}"
      LIVEKIT_JWT_BIND: ":8080"
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: "${LIVEKIT_INSECURE_SKIP_VERIFY_TLS:-false}"
      # Mandatory since v0.5.0: without it the container exits at startup with
      # "LIVEKIT_FULL_ACCESS_HOMESERVERS environment variable must be set"
      # (reproduced against the pinned digest, 2026-08-01). Must stay an
      # explicit hostname — "*" would grant LiveKit room-creation to users of
      # ANY federated homeserver. Startup echoes the parsed value, so the
      # deployed setting is checkable in the logs.
      LIVEKIT_FULL_ACCESS_HOMESERVERS: "${MATRIX_HOST}"
    depends_on:
      matrix_synapse:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks:
      - portal-net
      - default

volumes:
  matrix_data:
  redis_data:

networks:
  portal-net:
    external: true
