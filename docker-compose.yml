services:
  matrix_synapse:
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    expose:
      - "${MATRIX_PORT}"
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_HOST}
      SYNAPSE_REPORT_STATS: ${MATRIX_REPORT_STATS}
      MATRIX_ADMIN_DID: ${MATRIX_ADMIN_DID:-}
      MAS_SHARED_SECRET: ${MAS_SHARED_SECRET}
    env_file:
      - .env
    depends_on:
      siwx-oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:${MATRIX_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - matrix_data:/data
    networks:
      - portal-net
      - default

  redis:
    image: redis
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - default

  siwx-oidc:
    build:
      context: ../siwx-oidc
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SIWEOIDC_REDIS_URL: "redis://redis"
      SIWEOIDC_ADDRESS: 0.0.0.0
      SIWEOIDC_HOST: ${SIWEOIDC_HOST}
      SIWEOIDC_PORT: ${SIWEOIDC_PORT}
      SIWEOIDC_BASE_URL: ${SIWEOIDC_BASE_URL}
      SIWEOIDC_SIGNING_KEY_PEM: ${SIWEOIDC_SIGNING_KEY_PEM}
      SIWEOIDC_MAS_SHARED_SECRET: ${MAS_SHARED_SECRET}
      SIWEOIDC_SYNAPSE_ENDPOINT: http://matrix_synapse:${MATRIX_PORT}
      SIWEOIDC_REQUIRE_SECRET: "false"
      RUST_LOG: ${RUST_LOG}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${SIWEOIDC_PORT}/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - portal-net
      - default

  element-web:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.element
    restart: unless-stopped
    environment:
      MATRIX_BASE_URL: ${MATRIX_BASE_URL}
      MATRIX_HOST: ${MATRIX_HOST}
      SIWEOIDC_BASE_URL: ${SIWEOIDC_BASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      matrix_synapse:
        condition: service_healthy
    networks:
      - portal-net
      - default

volumes:
  matrix_data:
  redis_data:

networks:
  portal-net:
    external: true
