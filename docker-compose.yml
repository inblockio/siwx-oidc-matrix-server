services:
  matrix_synapse:
    # SYNAPSE_IMAGE_REF / ELEMENT_IMAGE_REF (not a shared IMAGE_TAG — see
    # 2026-07-31 note below): full image refs, so each image can be pinned to
    # its OWN digest, including the digest-only `repo@sha256:…` form. Kept
    # separate on purpose — a single `IMAGE_TAG:${TAG}` applied to both
    # `synapse:${TAG}` and `element-web:${TAG}` cannot express two different
    # digests for the same tag string, and GHCR sha-tags have been observed to
    # be republishable (element-web:sha-4a3d434 drifted from the bytes
    # originally deployed under that tag), so tag-only pinning is not
    # sufficient. Every image below follows the same pattern.
    #
    # The defaults are IMMUTABLE (2026-09-29): tag plus digest of the images CI
    # published from main (Synapse at 70b897e, 2026-10-11, lk-jwt-service at 5190a44, 2026-10-15,
    # Element Web at 33a0c95), which carry exactly the Synapse version,
    # Element tag and patch set the README's Dependencies table lists. They used
    # to be `:main`, so a checkout with no overrides silently ran whatever main
    # was at pull time, and start-matrix.sh pulls on every start. A required
    # `${VAR:?}` would have broken start-matrix.sh, which writes no image refs.
    # The digest decides the bytes; the `sha-` tag only names the commit that
    # built them. Bump deliberately, with the README row and the SYNAPSE_IMAGE
    # default in real-stack/Dockerfile.synapse: take the digest a later main
    # build published under its `sha-<commit>` tag. A default can only name a
    # build of an EARLIER commit: no commit can hold its own build's digest.
    image: ${SYNAPSE_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc-matrix-server/synapse:sha-70b897e@sha256:986294c6147b9d0b0a519051b9fa9b7afc22f63d5975df220205c332719e3fb5}
    restart: unless-stopped
    expose:
      - "${MATRIX_PORT}"
    environment:
      SYNAPSE_SERVER_NAME: ${MATRIX_HOST}
      SYNAPSE_REPORT_STATS: ${MATRIX_REPORT_STATS}
      MATRIX_ADMIN_DID: ${MATRIX_ADMIN_DID:-}
      MATRIX_ADMIN_MXID: ${MATRIX_ADMIN_MXID:-}
      MAS_SHARED_SECRET: ${MAS_SHARED_SECRET}
    env_file:
      - .env
    depends_on:
      siwx-oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fSs http://localhost:${MATRIX_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - matrix_data:/data
      # Optional guest policy module (private repo, so not in the image): mount a
      # checkout PINNED BY COMMIT read-only, then set GUEST_POLICY_ENABLED=true in
      # .env. The GUEST_POLICY_* settings reach the container through env_file
      # above. With the flag on and no mount, Synapse REFUSES TO START.
      # See README "Guest policy module (optional)".
      # - ${GUEST_POLICY_SRC:?set GUEST_POLICY_SRC to the module checkout}:/modules/synapse-guest-policy:ro
    networks:
      - portal-net
      - default

  redis:
    # REDIS_IMAGE_REF: env-overridable digest-pinned ref — same pattern as
    # SYNAPSE_IMAGE_REF/ELEMENT_IMAGE_REF above.
    # Default (2026-09-25) = the version TESTED on dev-staging: redis 8.10.2
    # (Docker Official Image; index digest cross-checked against
    # docker-library/repo-info). PROD DOES NOT RUN THIS: it runs redis 8.8.0
    # (redis:latest@sha256:aa049e68..., verified 2026-07-31) and pins it via
    # REDIS_IMAGE_REF in its own stack's .env, which wins over this
    # default. Taking prod to the default is a deliberate forward upgrade
    # (8.8 -> 8.10 against prod's AOF) and needs its own promotion step; a
    # DOWNGRADE of either box against an existing AOF is a data-loss risk.
    image: ${REDIS_IMAGE_REF:-redis:8.10.2@sha256:d5ac52db24d4e70566fe9944f22cf5bdc2bc739b05c0f426335161ea6c23f3b3}
    # Password (docs/redis-password.md): Redis reads `requirepass <password>`
    # from secrets/redis.conf on STDIN (the `-` argument). This shell runs as
    # root and opens the file before the image entrypoint drops Redis to the
    # redis user, so the file stays 0600 and owned by the stack user, and the
    # password is on no command line and in no `docker inspect` output. The
    # `-` must stay the FIRST argument after redis-server: the entrypoint
    # appends --loadmodule flags, and Redis reads stdin only when `-` is the
    # first or the last argument.
    command: ["sh", "-c", "exec /usr/local/bin/docker-entrypoint.sh redis-server - --appendonly yes < /run/secrets/redis_conf"]
    secrets:
      - redis_conf
    healthcheck:
      # Authenticated, so "healthy" also proves the password file works. A
      # plain `redis-cli ping` answers NOAUTH and still exits 0.
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$(sed -n 's/^requirepass //p' /run/secrets/redis_conf)\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    volumes:
      - redis_data:/data
    # Only on redis-net: siwx-oidc is its one client, so no other service of
    # the stack can reach Redis at all.
    networks:
      - redis-net

  siwx-oidc:
    # Built by the separate siwx-oidc repo, so it is versioned independently of
    # synapse + element-web. SIWX_OIDC_IMAGE_REF is a FULL image ref (not a
    # bare tag, which the old SIWX_OIDC_TAG was) so that a digest-only
    # `ghcr.io/inblockio/siwx-oidc@sha256:…` pin is expressible. CI builds are
    # not reproducible, and a branch tag such as `:main` moves with every
    # build, so a tag name alone can misdescribe the bytes a deployment runs.
    # Default: immutable, like SYNAPSE_IMAGE_REF above. The build siwx-oidc's CI
    # published from its main at 40efae9 (2026-09-29).
    image: ${SIWX_OIDC_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc:sha-40efae9@sha256:54739f4813bfa5dcfb104cdfdf1fedd4c7b7ff7a4c307059128cf047a30ba12f}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    # The Redis URL, password included, is `redis_url` in secrets/siwx-oidc.toml,
    # mounted as siwx-oidc.toml in the working directory, where siwx-oidc reads
    # its config file (docs/redis-password.md). Set no SIWEOIDC_REDIS_URL or
    # SIWXOIDC_REDIS_URL in `environment`: the environment beats the file. The
    # file is 0640 and its group is the stack user's; siwx-oidc runs as uid
    # 10001 and reads it through that group (group_add).
    secrets:
      - source: siwx_oidc_toml
        target: /siwx-oidc/siwx-oidc.toml
    group_add:
      - "${STACK_SECRETS_GID:-1000}"
    environment:
      SIWEOIDC_ADDRESS: 0.0.0.0
      SIWEOIDC_HOST: ${SIWEOIDC_HOST}
      SIWEOIDC_PORT: ${SIWEOIDC_PORT}
      SIWEOIDC_BASE_URL: ${SIWEOIDC_BASE_URL}
      SIWEOIDC_SIGNING_KEY_PEM: ${SIWEOIDC_SIGNING_KEY_PEM}
      SIWEOIDC_MAS_SHARED_SECRET: ${MAS_SHARED_SECRET}
      SIWEOIDC_SYNAPSE_ENDPOINT: http://matrix_synapse:${MATRIX_PORT}
      SIWEOIDC_REQUIRE_SECRET: "false"
      SIWEOIDC_SUPPORTED_DID_METHODS: '["pkh","key"]'
      SIWEOIDC_MATRIX_SERVER_NAME: ${MATRIX_HOST}
      RUST_LOG: ${RUST_LOG}
      # Opt-ins, off when empty (set them in .env; see .env.example). The
      # three names exist in siwx-oidc builds from 2026-09-30 on; an older
      # build ignores the two URIs and also reads an empty ENS URL as off.
      SIWXOIDC_ENS_API_URL: ${SIWXOIDC_ENS_API_URL:-}
      SIWXOIDC_OP_TOS_URI: ${SIWXOIDC_OP_TOS_URI:-}
      SIWXOIDC_OP_POLICY_URI: ${SIWXOIDC_OP_POLICY_URI:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:${SIWEOIDC_PORT}/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - portal-net
      - default
      - redis-net

  element-web:
    # See SYNAPSE_IMAGE_REF comment above — same split-var rationale, same
    # immutable default (main at 33a0c95: Element Web v1.12.29, all ten patches).
    image: ${ELEMENT_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc-matrix-server/element-web:sha-33a0c95@sha256:1761832069bd37ba089f62a5f74ba847171738444a62146a5ca9685dc5dd56a0}
    restart: unless-stopped
    environment:
      MATRIX_BASE_URL: ${MATRIX_BASE_URL}
      MATRIX_HOST: ${MATRIX_HOST}
      CLIENT_HOST: ${CLIENT_HOST}
      SIWEOIDC_BASE_URL: ${SIWEOIDC_BASE_URL}
    volumes:
      - ./config/element-config.json:/app/config.json.src:ro
      - ./entrypoints/element_entrypoint.sh:/docker-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      matrix_synapse:
        condition: service_healthy
    networks:
      - portal-net
      - default

  livekit:
    # Pinned: an unpinned :latest jumps SFU versions on any `docker compose pull`
    # (start-matrix.sh pulls on every start), which can change call behavior
    # unannounced. Bump deliberately. Default (2026-10-18) = our CI build of
    # v1.13.10 (livekit-server + relay-policy and downlink-padding patches, and
    # the pion/turn patch they build against, 697233b); set
    # LIVEKIT_IMAGE_REF in .env to pin a deployment by digest. OUR build, not
    # stock: the relay policy below (LIVEKIT_RELAY_POLICY_DIR) exists only in
    # dockerfiles/Dockerfile.livekit, and the stock image silently ignores it.
    # Since v1.13.8 the server rejects an unknown
    # rtc.congestion_control.send_side_bwe_pacer value (config/livekit.yaml sets
    # none). v1.13.10 (livekit#4992) refuses TURN TCP relays and lets embedded
    # TURN relay to this host's own addresses only on the RTC media UDP ports
    # (rtc.port_range_start/end), which is where an SFU candidate lives; see
    # skills/matrix-rtc-transport-specialist.md.
    image: ${LIVEKIT_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc-matrix-server/livekit-server:sha-697233b@sha256:b65a2b22a5ce9995f0bde502babbe3e8a609d4609537c389c02ee3b8d7b15541}
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_KEY}: ${LIVEKIT_SECRET}"
      # Relay policy (patches/livekit/0001-relay-policy.patch, so only in our
      # livekit-server image built by dockerfiles/Dockerfile.livekit; the stock
      # image ignores it): clients from the IP ranges in config/relay-policy/*.yaml
      # get relay-only ICE over TURN/TLS :443 from the start. Needs embedded TURN
      # with its TLS leg (`turn.enabled`, `turn.domain`, `tls_port` in
      # config/livekit.yaml); without one LiveKit ignores the policy and warns.
      # The policy files reload within 30 s of a change, no restart.
      LIVEKIT_RELAY_POLICY_DIR: /etc/livekit-relay-policy
      # Signs the webhooks to lk-jwt (`webhook:` in config/livekit.yaml). Must be
      # the key lk-jwt runs with (LIVEKIT_KEY below); the secret is the key's own.
      LIVEKIT_WEBHOOK_API_KEY: "${LIVEKIT_KEY}"
      # Downlink padding (livekit patch 0002 + the pion/turn patch in the same
      # image; the stock image ignores it): every server-to-client TURN media
      # message is padded up to this size, so the relayed flow's message sizes
      # do not reveal call media (audio ~200 B at 50 Hz, video ~1200 B bursts).
      # Unset or empty = off. Applies only to media the SERVER relays; the
      # client's own uplink is the browser's and cannot be padded here.
      LIVEKIT_TURN_DOWNLINK_PAD_BYTES: "1300"
    # Host-published ports (revised 2026-10-18, see the turn-tls follow-up):
    # under the catch-all relay policy (config/relay-policy/all.yaml) every
    # client is relay-only over TURN/TLS, which terminates at the edge :443
    # (SNI split; container 5349 is internal to the proxy network), so the
    # direct-ICE TCP port 7881 and the plain TURN UDP listener 3478 are
    # unused and stay closed, and TURN relay allocations bind
    # container-internal ports (turn.relay_range default 30000-40000). But
    # the UDP media range 20100-20200 IS still used by relayed calls: a
    # client's relayed ICE checks address the SFU's advertised candidate
    # (mapped IP on a media port) and those writes hairpin through this
    # docker-proxy publish. LiveKit patch 0003 was meant to deliver them on an
    # interface address instead, but all three of its revisions broke relayed
    # joins on dev (see the 0003 registry entry), so until local delivery is
    # re-qualified the range stays published. Removing a publish is what
    # closes a port: Docker publishes bypass the host firewall (ufw). The
    # ranges stay in
    # config/livekit.yaml: they name what the SFU binds inside the container
    # (the media-port allowlist embedded TURN relays on this host's own
    # addresses).
    ports:
      # Must match rtc.port_range_start/end in config/livekit.yaml exactly.
      - "20100-20200:20100-20200/udp"
    volumes:
      - ./config/livekit.yaml:/etc/livekit.yaml:ro
      # The DIRECTORY, never a single policy file: a git checkout replaces a
      # file's inode, and a single-file bind mount keeps showing the old one.
      - ./config/relay-policy:/etc/livekit-relay-policy:ro
    healthcheck:
      # busybox wget (the image has no curl); GET / is LiveKit's unauthenticated
      # liveness endpoint. It answers 406 until the node publishes its first
      # stats tick, most of it the use_external_ip STUN lookup — hence
      # start_period. Re-measured against livekit/livekit-server:v1.13.6 + this
      # config on 2026-08-30: first response (406) at ~6s, 200 by ~17s, so the
      # 30s start_period still covers it. (Was 8s on v1.12.0 — slower, same
      # 406-then-200 semantics, still inside the window.)
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7880/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - portal-net
      - default

  lk-jwt-service:
    # LK_JWT_IMAGE_REF: env-overridable full image ref, same pattern as
    # REDIS_IMAGE_REF above. Default (2026-10-15) = the lk-jwt-service image
    # built by dockerfiles/Dockerfile.lk-jwt at 5190a44 (upstream v0.9.0, which
    # checks room membership itself), published by CI next to the synapse and
    # element-web images (issue #40), pinned to the build of main at 5190a44.
    # It is the first build without the retired restrict-screen-share.patch
    # (plain upstream, no patch).
    # WARNING: this image refuses EVERY call token (403) unless Synapse can
    # answer the MSC4502 membership question: Synapse v1.162.0 or later (this
    # file's SYNAPSE_IMAGE_REF default) with the registration that
    # matrix_server.sh renders from LK_JWT_AS_TOKEN/LK_JWT_HS_TOKEN. With an
    # older Synapse, or without the tokens, no one can join a call.
    # A deployment whose .env pins LK_JWT_IMAGE_REF keeps running that image
    # until it changes the pin.
    # Behaviour change since 0.7.0 (#222) still applies: only
    # LIVEKIT_FULL_ACCESS_HOMESERVERS users and local users may publish;
    # federated users get subscribe-only tokens.
    image: ${LK_JWT_IMAGE_REF:-ghcr.io/inblockio/siwx-oidc-matrix-server/lk-jwt-service:sha-5190a44@sha256:c4f9d1ebde0e73f625f6719c10a58a8c27edc6731ccc0aab5c15d10a36584a6a}
    restart: unless-stopped
    environment:
      # MUST stay the PUBLIC wss:// URL — do not "fix" it to http://livekit:7880.
      # Through v0.6.0 LIVEKIT_URL is used for BOTH the client-facing SFU URL it
      # hands out AND its own server-side RoomService (CreateRoom) client; there
      # is still no separate override for the latter (LIVEKIT_CS_API_URL_OVERRIDES
      # is the Matrix C-S API, not LiveKit). So the CreateRoom call hairpins back
      # in through Caddy, which is why the /livekit/sfu/twirp/* block there is
      # scoped to non-private source IPs (the twirp block in Caddyfile.local).
      # That holds only while the hairpin reaches Caddy from a PRIVATE address.
      # Docker's NAT normally ensures it; a floating IP, or an egress path that
      # leaves and re-enters the network, does not, and then full-access room
      # creation 403s and calls break. Check on each host that Caddy logs
      # lk-jwt's CreateRoom with a private remote_ip.
      LIVEKIT_URL: "wss://${MATRIX_HOST}/livekit/sfu"
      LIVEKIT_KEY: "${LIVEKIT_KEY}"
      LIVEKIT_SECRET: "${LIVEKIT_SECRET}"
      LIVEKIT_JWT_BIND: ":8080"
      LIVEKIT_INSECURE_SKIP_VERIFY_TLS: "${LIVEKIT_INSECURE_SKIP_VERIFY_TLS:-false}"
      # Mandatory since v0.5.0: without it the container exits at startup with
      # "LIVEKIT_FULL_ACCESS_HOMESERVERS environment variable must be set"
      # (reproduced against the pinned digest, 2026-08-01). Must stay an
      # explicit hostname — "*" would grant LiveKit room-creation to users of
      # ANY federated homeserver. Startup echoes the parsed value, so the
      # deployed setting is checkable in the logs.
      LIVEKIT_FULL_ACCESS_HOMESERVERS: "${MATRIX_HOST}"
      # Membership is checked before an SFU token is issued: without it any
      # OpenID holder gets a token for ANY room. Upstream v0.9.0 (#250) turns
      # the check on by itself when it runs as an application service and
      # LIVEKIT_FULL_ACCESS_HOMESERVERS is exactly LIVEKIT_HS_SERVER_NAME; both
      # come from MATRIX_HOST below, so they cannot diverge. The service logs
      # a startup warning when the check is off.
      # Read only by images that predate upstream v0.9.0 (v0.8.0 plus the old
      # require-membership.patch, e.g. sha-70b897e): there the
      # check is off without it. v0.9.0 and newer ignore it. Keep it while any
      # deployment pins such an image, or that deployment skips the check.
      LIVEKIT_REQUIRE_MEMBERSHIP: "true"
      # Pull fallback for a missed SFU webhook: every N seconds a delegated-leave
      # job re-checks that its participant is still on the SFU. 0 disables it.
      # Upstream images before the webhook handling ignore the variable.
      LIVEKIT_SANITY_CHECK_INTERVAL_SECONDS: "${LK_JWT_SANITY_CHECK_INTERVAL_SECONDS:-60}"
      # Add LK_JWT_AS_TOKEN and LK_JWT_HS_TOKEN to .env (env.example says how);
      # the same two values reach Synapse through env_file, where
      # matrix_server.sh renders the registration. Empty defaults only so the
      # file still parses on an .env that predates them. The server name is
      # always set, so lk-jwt (upstream too) REFUSES TO START without the two
      # tokens ("must either all be set or all be left empty"): it fails closed
      # instead of serving tokens without the membership check.
      LIVEKIT_AS_TOKEN: "${LK_JWT_AS_TOKEN:-}"
      LIVEKIT_HS_TOKEN: "${LK_JWT_HS_TOKEN:-}"
      LIVEKIT_HS_SERVER_NAME: "${MATRIX_HOST}"
      # The membership look-up carries the AS token, which can act as any local
      # user (see matrix_server.sh): send it to Synapse inside the compose
      # network, never out through the public edge.
      LIVEKIT_CS_API_URL_OVERRIDES: "${MATRIX_HOST}=http://matrix_synapse:${MATRIX_PORT}"
    # lk-jwt 0.6.0 ships an image-level HEALTHCHECK that is unconditionally
    # broken: /lk-jwt-service-healthcheck builds its URL as
    # "http://localhost:" + LIVEKIT_JWT_BIND, so our (and upstream's own)
    # canonical ":8080" produces "http://localhost::8080/healthz" ->
    # `invalid port "::8080" after host`, failing forever. Setting a bare
    # "8080" fixes the helper but makes the SERVER exit 1 with
    # `listen tcp: address 8080: missing port in address` — mutually
    # exclusive, verified against the pinned digest on 2026-08-30. Left
    # enabled it marks the container unhealthy, so any deploy that gates on
    # container health fails EVERY converge, even of unrelated services.
    # Disabling restores the 0.5.0 behaviour this service was always
    # documented to have ("no healthcheck by design"); probe /healthz
    # externally instead.
    # Still disabled HERE on purpose (2026-09-25): prod's .env pins 0.5.0, and
    # this file must not start health-gating an image it was never verified
    # against. Re-enable only after /healthz of the default image (v0.8.0 plus
    # the membership patch) is verified on a deployment.
    healthcheck:
      disable: true
    depends_on:
      matrix_synapse:
        condition: service_healthy
      livekit:
        condition: service_healthy
    networks:
      - portal-net
      - default

volumes:
  matrix_data:
  redis_data:

networks:
  portal-net:
    external: true
  # Redis and its one client, siwx-oidc. internal: no route out of the host.
  redis-net:
    internal: true

# The Redis password (docs/redis-password.md). Created by
# `scripts/redis-secret.sh init`, which start-matrix.sh runs. Docker refuses
# to create the containers when a file is missing.
secrets:
  redis_conf:
    file: ./secrets/redis.conf
  siwx_oidc_toml:
    file: ./secrets/siwx-oidc.toml
